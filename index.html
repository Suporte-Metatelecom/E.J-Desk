<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>html,body{margin:0;padding:0}
/* Produção: esconde o que só existe no protótipo */
.sim,[data-act="baseExemplo"],[data-act="avancar24"],.ad,[data-go="decisoes"]{display:none!important}</style>
<title>E.J. Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#141B26; --muted:#5B6677; --line:#DDE2EA;
  --primary:#1E4FD6; --primary-ink:#FFFFFF; --primary-soft:#E8EEFF;
  --side:#0F1724; --side-ink:#C9D2E0; --side-muted:#7C8799; --side-active:#1B2638;
  --novo:#0E6F8A; --novo-bg:#DFF3F8; --analise:#8F5B00; --analise-bg:#FFF1D1;
  --resolvido:#1C7A43; --resolvido-bg:#E1F4E8; --encerrado:#4B5563; --encerrado-bg:#ECEEF1; --aguard:#A2560B; --aguard-bg:#FDEEDC;
  --atrasado:#B42318; --atrasado-bg:#FDE7E4; --atipico:#7A3DB8; --atipico-bg:#F1E8FB;
  --decidir:#8A5A00; --decidir-bg:#FFF6DB; --decidir-line:#F0D78A;
  --bronze:#A0612B; --prata:#6F7C8B; --ouro:#A67F00; --diamante:#1F86B0;
  --shadow:0 1px 2px rgba(15,23,36,.06),0 4px 16px rgba(15,23,36,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C121B; --surface:#141C28; --surface-2:#18212F; --ink:#E6EBF2; --muted:#94A1B4; --line:#263244;
    --primary:#7094FF; --primary-ink:#0C121B; --primary-soft:#1B2747;
    --side:#080D14; --side-ink:#C9D2E0; --side-muted:#6E7A8D; --side-active:#152033;
    --novo:#5CC6E0; --novo-bg:rgba(92,198,224,.14); --analise:#F2B544; --analise-bg:rgba(242,181,68,.14);
    --resolvido:#5BCB8A; --resolvido-bg:rgba(91,203,138,.14); --encerrado:#A7B0BD; --encerrado-bg:rgba(167,176,189,.14); --aguard:#F5A75B; --aguard-bg:rgba(245,167,91,.14);
    --atrasado:#FF8A7A; --atrasado-bg:rgba(255,138,122,.14); --atipico:#C39BF0; --atipico-bg:rgba(195,155,240,.14);
    --decidir:#F2C45C; --decidir-bg:rgba(242,196,92,.10); --decidir-line:rgba(242,196,92,.35);
    --bronze:#D8955A; --prata:#AAB5C3; --ouro:#E0B93A; --diamante:#5CC0E8;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C121B; --surface:#141C28; --surface-2:#18212F; --ink:#E6EBF2; --muted:#94A1B4; --line:#263244;
  --primary:#7094FF; --primary-ink:#0C121B; --primary-soft:#1B2747;
  --side:#080D14; --side-ink:#C9D2E0; --side-muted:#6E7A8D; --side-active:#152033;
  --novo:#5CC6E0; --novo-bg:rgba(92,198,224,.14); --analise:#F2B544; --analise-bg:rgba(242,181,68,.14);
  --resolvido:#5BCB8A; --resolvido-bg:rgba(91,203,138,.14); --encerrado:#A7B0BD; --encerrado-bg:rgba(167,176,189,.14); --aguard:#F5A75B; --aguard-bg:rgba(245,167,91,.14);
  --atrasado:#FF8A7A; --atrasado-bg:rgba(255,138,122,.14); --atipico:#C39BF0; --atipico-bg:rgba(195,155,240,.14);
  --decidir:#F2C45C; --decidir-bg:rgba(242,196,92,.10); --decidir-line:rgba(242,196,92,.35);
  --bronze:#D8955A; --prata:#AAB5C3; --ouro:#E0B93A; --diamante:#5CC0E8;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* app shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
/* Barras de rolagem: finas, sem trilho, na cor do tema; aparecem ao passar o mouse */
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border-radius:6px}
:hover::-webkit-scrollbar-thumb{background:var(--line)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.side{scrollbar-width:thin;scrollbar-color:transparent transparent}
.side:hover{scrollbar-color:#2A3649 transparent}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-track{background:transparent}
.side::-webkit-scrollbar-thumb{background:transparent;border-radius:6px}
.side:hover::-webkit-scrollbar-thumb{background:#2A3649}
.side::-webkit-scrollbar-thumb:hover{background:var(--side-muted)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:12px}
.brand b{font-size:15px;font-weight:600;color:#fff}
.brand small{display:block;font-size:11px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--side-ink);font-size:13.5px}
.nav button:hover{background:var(--side-active)}
.nav button.on{background:var(--side-active);color:#fff;box-shadow:inset 2px 0 0 var(--primary)}
.nav button:focus-visible{outline:2px solid var(--primary)}
.nav button[disabled]{opacity:.45;cursor:not-allowed}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .tag{margin-left:auto;font-size:10px;color:var(--side-muted)}
.nav button.fold{font-weight:600;color:#fff}
.nav .femo{width:16px;text-align:center;font-size:14px;line-height:1}
.nav .fcar{margin-left:auto;font-size:10px;color:var(--side-muted);transition:transform .15s}
.nav button.fold:not(.open) .fcar{transform:rotate(-90deg)}
.nav .foldbox{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.nav .subcat{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:8px 10px 2px 30px;font-weight:600}
.nav .subgrp{display:flex;align-items:center;gap:10px;padding:8px 10px 2px;color:var(--side-ink);font-size:13.5px}
.nav button.child{padding-left:30px;font-size:13px}
.nav button.child svg{width:15px;height:15px;opacity:.85}
.sim{border:1px solid #243047;border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px}
.sim .seg{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.sim .seg button{all:unset;cursor:pointer;text-align:center;font-size:11px;padding:5px 0;border-radius:5px;color:var(--side-ink)}
.sim .seg button.on{background:#fff;color:#0F1724;font-weight:600}
.sim .seg button:focus-visible{outline:2px solid var(--primary)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid #1E2838}
.flag.f-uni{color:var(--primary);background:var(--primary-soft)}
.dup-item{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.dup-item:first-of-type{border-top:0}
.anx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px}
.anx{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.anx-thumb{all:unset;cursor:zoom-in;display:block;height:140px;background:var(--surface-2)}
.anx-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.anx-video{width:100%;height:160px;background:#000;display:block}
.anx-txt{margin:0;height:140px;overflow:auto;padding:8px 10px;font:11.5px/1.45 var(--mono);background:var(--surface-2);white-space:pre-wrap;overflow-wrap:anywhere}
.anx-ico{height:90px;display:flex;align-items:center;justify-content:center;background:var(--surface-2)}
.anx-ico svg{width:40px;height:40px}
.anx-info{padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.anx-info b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anx-view{position:fixed;inset:0;z-index:90;background:rgba(8,12,20,.82);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.anx-view iframe{width:min(1000px,100%);height:100%;border:0;border-radius:8px;background:#fff}
.anx-view pre{width:min(900px,100%);max-height:100%;overflow:auto;margin:0;padding:16px;border-radius:8px;background:var(--surface);color:var(--ink);font:13px/1.5 var(--mono);white-space:pre-wrap;cursor:auto}
.anx-pdf{width:min(900px,100%);max-height:100%;overflow:auto;background:var(--surface-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center;cursor:auto}
.anx-xls{align-items:stretch;background:var(--surface);color:var(--ink)}
.xls-sheet table{font-size:12px}.xls-sheet td{white-space:nowrap;padding:4px 8px;border:1px solid var(--line)}
.anx-pdf canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.anx-view video{max-width:100%;max-height:100%;border-radius:8px}
.anx-view .anx-x{position:fixed;top:14px;right:18px;color:#fff;font-size:13px;opacity:.85}
.anx-view img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.ico-xls{flex:none;vertical-align:-3px}
.dd-card{display:flex;gap:16px;align-items:center;justify-content:space-between}
.dd-card p{margin-top:4px;max-width:720px}
.dd-card .btn{white-space:nowrap;flex:none}
@media (max-width:820px){.dd-card{flex-direction:column;align-items:flex-start}}
.note.warn-ret{display:flex;gap:12px;align-items:center;justify-content:space-between;border-color:var(--analise)}
.avatar.foto{padding:0;overflow:hidden;background:var(--surface-2)}
.avatar.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.avatar{width:32px;height:32px;border-radius:50%;background:#26334A;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.me .who{flex:1;min-width:0}
.me .who b{display:block;font-size:13px;color:#fff;font-weight:500}
.me .who span{font-size:11.5px;color:var(--side-muted)}
.linkbtn{all:unset;cursor:pointer;font-size:12px;color:var(--side-muted)}
.linkbtn:hover{color:#fff}

.main{min-width:0;padding-block:28px 60px;padding-inline:32px}
.top{display:none}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head .t{display:flex;flex-direction:column;gap:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sep{height:1px;background:var(--line);border:0;margin:0}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;text-align:left}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--atrasado);border-color:var(--atrasado-bg)}
.btn.block{width:100%;justify-content:flex-start}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12.5px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:500}
.field label i{font-style:normal;color:var(--atrasado)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:9px 11px;font-size:14px}
textarea.in{min-height:84px;resize:vertical}
.in:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
.in.err{border-color:var(--atrasado)}
.hint{font-size:12px;color:var(--muted)}
.errtxt{font-size:12px;color:var(--atrasado)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Novo{color:var(--novo);background:var(--novo-bg)}
.s-Em{color:var(--analise);background:var(--analise-bg)}
.s-Resolvido{color:var(--resolvido);background:var(--resolvido-bg)}
.s-Encerrado{color:var(--encerrado);background:var(--encerrado-bg)}
.s-Aguardando{color:var(--aguard);background:var(--aguard-bg)}
.timer{border:1px solid var(--aguard);background:var(--aguard-bg);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.timer b{color:var(--aguard)}
.timer .clock{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--aguard);font-variant-numeric:tabular-nums}
.s-Excluido{color:var(--encerrado);background:transparent;border:1px dashed var(--line)}
.flag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;letter-spacing:.02em}
.f-atr{color:var(--atrasado);background:var(--atrasado-bg)}
.f-ati{color:var(--atipico);background:var(--atipico-bg)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.lvl::before{content:"";width:9px;height:9px;transform:rotate(45deg);background:currentColor;border-radius:2px}
.l-Bronze{color:var(--bronze)} .l-Prata{color:var(--prata)} .l-Ouro{color:var(--ouro)} .l-Diamante{color:var(--diamante)}

/* a decidir */
.ad{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--decidir);background:var(--decidir-bg);border:1px dashed var(--decidir-line);padding:1px 7px;border-radius:4px;white-space:nowrap;cursor:pointer}
.ad::before{content:"?";font-family:var(--mono);font-size:10px}
.note{border:1px dashed var(--decidir-line);background:var(--decidir-bg);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.note b{color:var(--decidir)}
.info{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted)}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td .flags{display:inline-flex;gap:4px;margin-left:6px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--primary)}
.kpi:focus-visible{outline:2px solid var(--primary)}
.kpi .n{font-size:28px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;line-height:1}
.kpi .k{display:flex;align-items:center;gap:7px}
.kpi .dot{width:8px;height:8px;border-radius:50%}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:120px 1fr 40px;gap:12px;align-items:center}
.track{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--primary);border-radius:999px}
.fill.g{background:var(--ouro)}
.weeks{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.weeks button{all:unset;cursor:pointer;padding:5px 11px;font-size:12.5px;font-family:var(--mono);border-right:1px solid var(--line)}
.weeks button:last-child{border-right:0}
.weeks button.on{background:var(--primary);color:var(--primary-ink)}
.weeks button:focus-visible{outline:2px solid var(--primary)}
@media (max-width:820px){.rcvazio{display:none}}
.rcseg{align-self:flex-start}.rcseg button{font-family:var(--sans);padding:8px 18px;font-size:13px}
.rcmais{display:inline-block;font-family:var(--sans);font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:4px}

/* detail */
.detail{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tl li:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.comment{display:flex;gap:10px}
.comment .bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;flex:1}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts span{font-size:13.5px;overflow-wrap:anywhere}

/* retorno */
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.qitem{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line)}
.qitem{box-sizing:border-box;width:100%;text-align:left}
.qitem .qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%}
.qitem .qtop .pill{margin-left:auto;flex:none}
.qitem .qtit{overflow-wrap:anywhere}
.qitem:last-child{border-bottom:0}
.qitem:hover{background:var(--surface-2)}
.qitem.on{background:var(--primary-soft)}
.qitem:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.mail{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mail .mh{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.mail .mh dt{color:var(--muted)}
.mail .mh dd{margin:0;overflow-wrap:anywhere}

/* login */
.login{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:grid;place-items:center;padding-block:32px;padding-inline:16px;background:
  radial-gradient(circle at 20% 0%, var(--primary-soft), transparent 45%), var(--bg)}
.login .card{width:100%;max-width:400px;padding:28px}

/* levels ladder */
.ladder{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}

function turnoAtual(){const d=new Date(agora()), m=d.getHours()*60+d.getMinutes(); if(m<=TURNOS.manha.fim) return "manha"; if(m<=TURNOS.tarde.fim) return "tarde"; return "noite";}

/* 29/09 (itens 54 e 59 + ideia do Patrick Moura): 4 situações pela QUEDA em relação à base (100% − linhas online/base).
   Cada registro guarda a base do momento (snapshot), então mudar a base depois não altera o histórico.
   Linhas BL não têm dado de conexão: a equipe escolhe a situação manualmente. */
const NIVEIS_INC = [
  {k:"normal",   nome:"Normal",                 cls:"n-normal",   ate:5},
  {k:"atencao",  nome:"Atenção",                cls:"n-atencao",  ate:15},

const isBL = o => /\sBL$/.test(o||"");
const baseDe = r => r.base!=null ? r.base : (S.incBase[r.operadora]||null);
const pct = r => { const b=baseDe(r); return b && r.linhas!=null ? Math.round(r.linhas/b*1000)/10 : null; };
const queda = r => { const p=pct(r); return p==null ? null : Math.max(0, Math.round((100-p)*10)/10); };
const nivelDe = r => { if(r.nivel) return NIVEIS_INC.find(n=>n.k===r.nivel); const q=queda(r); return q==null ? null : NIVEIS_INC.find(n=>q<=n.ate); };
const instavel = r => { const n=nivelDe(r); return !!n && NIVEIS_HIST.includes(n.k); };

function temArea(area, u=ctx()){
  if(AREAS_GLOBAIS.includes(area)) return true;
  if(!SETORES[area]) return false;                    // setor oculto/desativado: ninguém acessa, nem o Diamante
  return u.setor===area || u.nivel===NIVEL_TODOS_SETORES;
}
function pode(recurso, u=ctx()){
  const r = RECURSOS[recurso];
  if(!r) return false;                       // recurso não cadastrado = sem acesso
  if(!temArea(r.area, u)) return false;      // filtro por setor
  if(LV[u.nivel] < LV[r.min]) return false;  // regra de nível existente
  if(r.only && u.nivel!==r.only) return false;
  return true;
}

function podeChamado(acao, t, u=ctx()){
  if(!t || !ACOES_CHAMADO[acao]) return false;
  if(!temArea(t.setor||"suporte", u)) return false;
  if(acao==="ver" && u.nivel==="Bronze") return t.criadoPor===me().nome && !t.excluido;   // Bronze: só os próprios, só leitura
  return LV[u.nivel] >= LV[ACOES_CHAMADO[acao]];
}

const PRAZO_ATRASO_PADRAO = 10;           // 1 dia útil a partir da abertura (29/09) = 10 horas de expediente
const prazoCat = cat => { const v=+((S.sla||{})[cat]); return v>0 ? v : PRAZO_ATRASO_PADRAO; };
/* Marca "Atrasado" nos chamados abertos no sistema (com criadoEmMs). Os exemplos fictícios mantêm a marcação que já tinham.
   Enquanto o chamado está Aguardando retorno, a contagem fica pausada (decidido em 28/09). */
const horasContadas = t => horasUteisEntre(t.criadoEmMs, agora()) - (t.pausas||[]).reduce((s,p)=>s+horasUteisEntre(p.ini, p.fim||agora()),0);
function rotinaAtraso(){
  S.tickets.forEach(t=>{ if(!t.criadoEmMs || t.excluido) return;
    if(t.status==="Novo"||t.status==="Em análise") t.flags.atrasado = horasContadas(t) > prazoCat(t.cat);
    else if(t.status==="Resolvido"||t.status==="Encerrado") t.flags.atrasado=false; });
}
function rotinaEncerramento(){
  rotinaAtraso();
  let n=0;
  S.tickets.forEach(t=>{
    if(t.status==="Aguardando retorno" && t.encerraEm && agora()>=t.encerraEm){
      t.status="Encerrado"; t.encerradoAuto=true; t.encerraEm=null; n++;
      t.hist.push([fmtDataHora(agora()),"Status alterado de \"Aguardando retorno\" para \"Encerrado\" pelo sistema: 1 dia útil sem resposta do cliente"]);
    }
  });
  return n;
}

/* Monta o menu a partir de NAV + pode(). Grupos (g) e pastas que abrem e fecham (fold) só aparecem se tiverem algum item permitido.
   A pasta da página atual fica sempre aberta. */
function menuHTML(cur){
  const out=[]; let grp=null, itens=[], fold=null, fItens=[], sub=null;   // sub: subcategoria dentro da pasta (só aparece se tiver item permitido)
  const fechaFold=()=>{ if(fold && fItens.length){ const aberto = S.navOpen[fold.fold]!==false || fItens.some(x=>x.on);
      itens.push(`<button class="fold${aberto?" open":""}" data-fold="${fold.fold}" aria-expanded="${aberto}"><span class="femo" aria-hidden="true">${fold.e}</span><span>${fold.t}</span><span class="fcar" aria-hidden="true">▾</span></button>`,
        `<div class="foldbox"${aberto?"":" hidden"}>${fItens.map(x=>x.html).join("")}</div>`); }
    fold=null; fItens=[]; };
  const flush=()=>{ fechaFold(); if(grp && itens.length) out.push(`<div class="grp">${grp.g}</div>`, ...itens); itens=[]; };
  NAV.forEach(n=>{
    if(n.g){flush();grp=n;return}
    if(n.fold!==undefined){fechaFold(); sub=null; if(n.fold) fold=n; return}
    if(n.sub){sub=n.sub; return}
    if(!pode(n.r)) return;
    const html=`<button data-go="${n.r}" class="${cur===n.r?"on":""}${fold?" child":""}" ${n.off?"disabled":""}>${IC[n.i]||""}<span>${n.t}</span>${n.tag?`<span class="tag">${n.tag}</span>`:""}${n.novo&&!fold?`<span class="tag">novo</span>`:""}</button>`;
    if(fold && sub){ fItens.push({html:`<div class="subcat">${esc(sub)}</div>`, on:false}); sub=null; }
    if(fold) fItens.push({html, on:cur===n.r}); else itens.push(html);
  });
  flush(); return out.join("");
}

/* 01/10: menu oculto mostra uma faixa só com os ícones das abas (mesmas permissões do menu). */
function railHTML(cur){
  const out=[]; let sep=false;

(function railDock(){
  let tip=null, alvo=null;
  const calmo=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dica=()=>tip||(tip=Object.assign(document.createElement("div"),{className:"rail-tip"}),tip.setAttribute("aria-hidden","true"),document.body.appendChild(tip),tip);
  function zera(rail){ rail?.querySelectorAll("button").forEach(b=>b.style.removeProperty("--s")); if(tip) tip.classList.remove("on"); alvo=null; }
  document.addEventListener("mousemove", e=>{
    const rail=e.target.closest?.(".app.collapsed .rail");
    if(!rail){ if(alvo) zera(document.querySelector(".rail")); return; }
    const y=e.clientY;
    if(!calmo()) rail.querySelectorAll("button").forEach(b=>{ const r=b.getBoundingClientRect(), d=Math.abs(y-(r.top+r.height/2)), k=Math.max(0,1-d/110);
      b.style.setProperty("--s",(1+0.3*k*k).toFixed(3)); });
    const b=e.target.closest("button[data-nome]");
    if(b!==alvo){ alvo=b; const t=dica();
      if(b){ const r=b.getBoundingClientRect(); t.textContent=b.dataset.nome; t.style.top=(r.top+r.height/2)+"px"; t.classList.remove("on"); void t.offsetWidth; t.classList.add("on"); }
      else t.classList.remove("on"); }
    else if(b && tip){ const r=b.getBoundingClientRect(); tip.style.top=(r.top+r.height/2)+"px"; }
  }, {passive:true});
  document.addEventListener("mouseleave", ()=>zera(document.querySelector(".rail")));
  document.addEventListener("focusin", e=>{ const b=e.target.closest?.(".app.collapsed .rail button[data-nome]"); const t=dica();
    if(b){ const r=b.getBoundingClientRect(); t.textContent=b.dataset.nome; t.style.top=(r.top+r.height/2)+"px"; t.classList.add("on"); } else if(!alvo) t.classList.remove("on"); });
  document.addEventListener("scroll", e=>{ if(e.target.classList?.contains("rail") && tip) tip.classList.remove("on"), alvo=null; }, true);
  document.addEventListener("click", e=>{ if(e.target.closest(".rail") && tip) tip.classList.remove("on"); });
  window.railEntrada=()=>{ const r=document.querySelector(".rail"); if(!r||calmo()) return; r.classList.remove("in"); void r.offsetWidth; r.classList.add("in"); setTimeout(()=>r.classList.remove("in"),900); };
})();

/* ============ Área de chamados: lista com ações rápidas ============
   Um único componente de lista serve o Suporte (Chamados) e as subcategorias do Financeiro.
   Toda ação passa por podeChamado(), a mesma regra usada na página do chamado e nas rotas. */
const STATUS = ["Novo","Em análise","Aguardando retorno","Resolvido","Encerrado"];
const STATUS_MANUAL = ["Novo","Em análise","Resolvido","Encerrado"];   // "Aguardando retorno" só pelo envio do retorno
/* 29/09 (item 42): mudança manual só na sequência do fluxo. Resolver exige a solução aplicada.
   Encerrar direto: só Diamante, com motivo. Voltar para Novo: só pelo "Reabrir" (Encerrado). */
function transicao(t, novo){                 // -> {ok, act?, motivo?}
  const at=t.status;
  if(novo===at) return {ok:false, motivo:"atual"};
  if(novo==="Aguardando retorno") return {ok:false, motivo:"Só pelo envio do retorno"};
  if(at==="Novo" && novo==="Em análise") return {ok:true};
  if(at==="Em análise" && novo==="Resolvido") return {ok:true, act:"resolver"};
  if(at==="Novo" && novo==="Resolvido") return {ok:false, motivo:"Passe antes por Em análise"};
  if(novo==="Encerrado") return S.level==="Diamante" && at!=="Encerrado" ? {ok:true, act:"encerrarDireto"} : {ok:false, motivo:"Pelo retorno ou pela rotina de 1 dia útil"};
  if(novo==="Novo") return at==="Encerrado" ? {ok:true, act:"reabrir"} : {ok:false, motivo:"Só reabrindo um chamado encerrado"};
  return {ok:false, motivo:"Fora da sequência do fluxo"};
}
const PRIORIDADES = ["Baixa","Normal","Alta","Urgente"];

/* Anexos: no protótipo o arquivo fica só na memória do navegador (some ao recarregar). Na versão real vai para o armazenamento do servidor. */

const tamArq = b => b>=1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB";

async function mostrarPDF(a, box){           // mostra até 20 páginas do PDF dentro da própria página

    const n=Math.min(doc.numPages,20);
    for(let i=1;i<=n;i++){const pg=await doc.getPage(i), vp=pg.getViewport({scale:1.4}), cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;box.appendChild(cv);await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise}
    if(doc.numPages>n) box.insertAdjacentHTML("beforeend",`<p class="small">Mostrando ${n} de ${doc.numPages} páginas. Baixe o arquivo para ver o resto.</p>`);
  }catch(e){ box.innerHTML=`<p class="small">Não foi possível mostrar este PDF aqui. Use "Baixar".</p>`; }
}
async function mostrarPlanilha(a, box){     // prévia: primeiras 60 linhas de cada aba (até 5 abas)

    const txt=c=>{if(c.isMerged&&c.master!==c) return ""; const v=c.value; if(v==null) return ""; if(v instanceof Date) return (v.getUTCHours()||v.getUTCMinutes())?v.toLocaleString("pt-BR",{timeZone:"UTC",dateStyle:"short",timeStyle:"short"}):v.toLocaleDateString("pt-BR",{timeZone:"UTC"}); if(typeof v==="object") return v.result!=null?String(v.result):v.text!=null?v.text:v.richText?v.richText.map(r=>r.text).join(""):""; return String(v)};
    box.innerHTML = wb.worksheets.slice(0,5).map(ws=>{const rows=[];ws.eachRow({includeEmpty:false},(r,i)=>{if(rows.length<60)rows.push(r)});

  }catch(e){ box.innerHTML=`<p class="small">Não foi possível mostrar esta planilha aqui. Use "Baixar" e abra no Excel.</p>`; }

async function salvarArquivo(nome, blob){
  const dl = window.claude ? await claude.use("downloads").catch(()=>null) : null;
  if(dl){ try{ await dl.save({filename:nome, data:blob}); } catch(e){ toast(e?.code==="declined"?"Download cancelado":e?.code==="rejected_extension"?"Esse tipo de arquivo não pode ser baixado aqui":"Não foi possível baixar o arquivo aqui."); } }
  else { const x=document.createElement("a"); x.href=URL.createObjectURL(blob); x.download=nome; document.body.appendChild(x); x.click(); setTimeout(()=>{URL.revokeObjectURL(x.href);x.remove()},1000); }
}
function guardarArquivos(files, por){
  return files.map(f=>{const a={id:"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), nome:f.name, tipo:tipoArq(f.name), tam:f.size, url:URL.createObjectURL(f), blob:f, por, em:stamp(), txt:null};
    if(a.tipo==="txt") f.text().then(x=>{a.txt=x.slice(0,1200);if(S.route==="detalhe")render()}).catch(()=>{});
    return a;});
}

  txt:`<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M6 2h9l5 5v15H6z" fill="#EEF1F6" stroke="#5B6677" stroke-width="1.4"/><path d="M9 11h8M9 14h8M9 17h5" stroke="#5B6677" stroke-width="1.3"/></svg>`,
  outro:`<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M6 2h9l5 5v15H6z" fill="#EEF1F6" stroke="#5B6677" stroke-width="1.4"/></svg>`};

  const arqs=t.arqs||[], semArq=t.anexos.filter(n=>!arqs.some(a=>a.nome===n));
  if(!arqs.length&&!semArq.length) return "";
  const card=a=>{const baixar=`<button class="btn sm" data-anxdl="${a.id}">Baixar</button>`, meta=`<span class="small muted">${tamArq(a.tam)} · ${esc(a.por)} · ${esc(a.em)}</span>`;
    const topo = a.tipo==="img" ? `<button class="anx-thumb" data-anx="${a.id}" title="Ampliar"><img src="${a.url}" alt="${esc(a.nome)}"></button>`
      : a.tipo==="video" ? `<video class="anx-video" src="${a.url}" controls preload="metadata"></video>`
      : a.tipo==="txt" ? `<pre class="anx-txt">${a.txt==null?"Carregando…":esc(a.txt)+(a.txt.length>=1200?"\n…":"")}</pre>`
      : `<div class="anx-ico">${a.tipo==="xls"?ICO_XLS.replace('width="16" height="16"','width="40" height="40"'):ICO_ARQ[a.tipo]||ICO_ARQ.outro}</div>`;
    const abrir = (a.tipo==="pdf"||a.tipo==="txt"||a.tipo==="img"||a.tipo==="video"||a.tipo==="xls") ? `<button class="btn sm" data-anx="${a.id}">Abrir</button>` : "";
    return `<div class="anx">${topo}<div class="anx-info"><b title="${esc(a.nome)}">${esc(a.nome)}</b>${meta}<span class="row" style="gap:6px">${abrir}${baixar}</span></div></div>`;};
  return `<div style="grid-column:1/-1"><span class="label">Anexos · ${arqs.length+semArq.length}</span>
    <div class="anx-grid">${arqs.map(card).join("")}${semArq.map(n=>`<div class="anx"><div class="anx-ico">${ICO_ARQ.outro}</div><div class="anx-info"><b>${esc(n)}</b><span class="small muted">Arquivo de exemplo, sem conteúdo no protótipo.</span></div></div>`).join("")}</div></div>`;
}
const prioBadge = p => `<span class="prio p-${esc(p||"Normal")}" title="Prioridade">${esc(p||"Normal")}</span>`;
const respNome = t => t.resp==="—" ? "Fila geral" : t.resp;
const dataAbertura = t => {const m=/(\d{2})\/(\d{2})\/(\d{4})/.exec(t.aberto||"");return m?new Date(+m[3],+m[2]-1,+m[1]):null};

const elegiveis = t => S.users.filter(u=>u.ativo && !u.desativado && (u.setor===t.setor || u.nivel===NIVEL_TODOS_SETORES) && LV[u.nivel]>=LV.Ouro);
const LF_VAZIO = {q:"", status:"", cat:"", resp:"", prio:"", setor:"", de:"", ate:"", atrasados:false, rapido:"todos"};
const lf = rota => (S.lf[rota] ||= {...LF_VAZIO});

function chamadosVisiveis(opts={}){
  return S.tickets.filter(t=>{
    if(!podeChamado("ver",t)) return false;
    if(t.excluido && !podeChamado("verExcluidos",t)) return false;
    if(opts.setorFixo && t.setor!==opts.setorFixo) return false;
    if(opts.tipo && t.tipo!==opts.tipo) return false;
    return true;
  });
}
function aplicarFiltros(list, f){
  const q=f.q.trim().toLowerCase(), qd=q.replace(/\D/g,"");
  return list.filter(t=>{
    const c=cli(t.cliente);
    if(q && !(t.id.toLowerCase().includes(q) || (t.titulo||"").toLowerCase().includes(q) || c.nome.toLowerCase().includes(q)
      || (qd.length>=3 && c.doc.replace(/\D/g,"").includes(qd))
      || [t.linha,t.bo,t.equip,t.protAt].some(x=>(x||"").toLowerCase().includes(q)))) return false;
    if(f.status && t.status!==f.status) return false;
    if(f.cat && t.cat!==f.cat) return false;
    if(f.resp && respNome(t)!==f.resp) return false;
    if(f.prio && (t.prioridade||"Normal")!==f.prio) return false;
    if(f.setor && t.setor!==f.setor) return false;
    if(f.atrasados && !t.flags.atrasado) return false;
    const d=dataAbertura(t);
    if(f.de && d && d < new Date(f.de+"T00:00")) return false;
    if(f.ate && d && d > new Date(f.ate+"T23:59")) return false;
    if(f.rapido==="meus" && t.resp!==me().nome) return false;
    if(f.rapido==="pendentes" && t.status!=="Aguardando retorno") return false;
    if(f.rapido==="atrasados" && !t.flags.atrasado) return false;
    return true;
  });
}

    {k:"Aguardando retorno", n:ativos.filter(t=>t.status==="Aguardando retorno").length, c:"var(--aguard)", set:{status:"Aguardando retorno",atrasados:false}},
    {k:"Atrasados", n:ativos.filter(t=>t.flags.atrasado).length, c:"var(--atrasado)", set:{status:"",atrasados:true}},
    {k:"Resolvidos", n:ativos.filter(t=>t.status==="Resolvido").length, c:"var(--resolvido)", set:{status:"Resolvido",atrasados:false}}
  ];
  const cats=[...new Set(base.map(t=>t.cat).filter(Boolean))].sort();

  const sel=(id,lab,val,opts2)=>`<label class="fsel"><span>${lab}</span><select class="in" id="${id}" data-f="${id.slice(2)}"><option value="">Todos</option>${opts2.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===val?"selected":""}>${esc(l)}</option>`}).join("")}</select></label>`;
  const rap=[["todos","Todos"],["meus","Meus chamados"],["pendentes","Aguardando retorno"],["atrasados","Atrasados"]];
  const temFiltro = JSON.stringify({...f,rapido:"todos"})!==JSON.stringify({...LF_VAZIO}) || f.rapido!=="todos";
  const cols = 8 + (multiSetor?1:0);
  return `<div class="page">
  <div class="head"><div class="t">${opts.label?`<span class="label">${esc(opts.label)}</span>`:""}<h1>${esc(opts.titulo)}</h1><p class="muted">${opts.sub||"Todos os chamados visíveis para o seu setor e nível de acesso."}</p></div>
    <div class="row"><div class="seg2" role="group" aria-label="Fila rápida">${rap.map(([v,l])=>`<button data-rapido="${v}" class="${f.rapido===v?"on":""}">${l}</button>`).join("")}</div></div></div>
  <div class="kpis">${cards.map((k,i)=>`<button class="kpi sm" data-lcard="${i}"><span class="k"><span class="dot" style="background:${k.c}"></span><span class="label">${k.k}</span></span><span class="n">${k.n}</span></button>`).join("")}</div>
  <section class="card filtros">
    <div class="frow">
      <input class="in" id="busca" type="search" placeholder="Buscar por protocolo, título, cliente, CNPJ ou linha" value="${esc(f.q)}">
      ${sel("f_status","Status",f.status,STATUS)}
      ${sel("f_cat","Categoria",f.cat,cats)}
      ${sel("f_resp","Responsável",f.resp,resps)}
      ${sel("f_prio","Prioridade",f.prio,PRIORIDADES)}
      ${multiSetor?sel("f_setor","Setor",f.setor,setoresVisiveis().map(k=>[k,SETORES[k].nome])):""}
      <label class="fsel"><span>Aberto de</span><input class="in" type="date" id="f_de" data-f="de" value="${esc(f.de)}"></label>
      <label class="fsel"><span>até</span><input class="in" type="date" id="f_ate" data-f="ate" value="${esc(f.ate)}"></label>
      <label class="fchk"><input type="checkbox" id="f_atr" data-f="atrasados" ${f.atrasados?"checked":""}> Apenas atrasados</label>
      ${temFiltro||S.filter?`<button class="btn sm" data-limpar>Limpar filtros</button>`:""}
    </div>
  </section>
  <section class="card"><div class="tbl-wrap"><table class="lista">
    <thead><tr><th>Protocolo</th><th>Título</th><th>Categoria</th><th>Prioridade</th><th>Responsável</th><th>Status</th>${multiSetor?"<th>Setor</th>":""}<th>Aberto em</th><th class="acoes">Ações</th></tr></thead>
    <tbody>${list.length?list.map(t=>linha(t,multiSetor)).join(""):`<tr><td colspan="${cols}"><div class="empty">Nenhum chamado encontrado com essa busca ou filtro.</div></td></tr>`}</tbody>
  </table></div></section>
  <p class="hint">Clique no protocolo ou no título para abrir o chamado completo. Clique no status ou no responsável para alterar direto na lista. Atrasado e Atípico aparecem como marcações ao lado do status.${list.some(t=>t.excluido)?" Chamados excluídos aparecem esmaecidos só para Diamante.":""}</p>
  ${opts.rodape||""}

}

function linha(t, multiSetor){
  const trat = !t.excluido && podeChamado("tratar",t);
  const st = t.excluido?`<span class="pill s-Excluido">Excluído</span>`:pill(t.status);
  return `<tr ${t.excluido?'style="opacity:.55"':""}>
    <td class="mono"><button class="lnk mono" data-open="${t.id}">${t.id}</button></td>
    <td><button class="lnk" data-open="${t.id}">${esc(t.titulo)}</button></td>
    <td>${esc(t.cat)}</td>
    <td>${prioBadge(t.prioridade)}</td>
    <td>${trat && t.status!=="Encerrado"?`<button class="inl" data-pop="resp" data-id="${t.id}" aria-haspopup="menu">${esc(respNome(t))}<span class="car">▾</span></button>`:esc(respNome(t))}</td>
    <td><span class="stcell">${trat?`<button class="inl" data-pop="status" data-id="${t.id}" aria-haspopup="menu">${st}<span class="car">▾</span></button>`:st}<span class="flags">${flags(t)}</span></span>${t.status==="Aguardando retorno"&&t.encerraEm?`<div class="small muted">encerra ${quandoEnc(t.encerraEm)}</div>`:""}</td>
    ${multiSetor?`<td>${esc(SETORES[t.setor]?.nome||"—")}</td>`:""}
    <td class="mono">${esc((t.aberto||"").slice(0,5))}</td>
    <td class="acoes"><button class="kebab" data-pop="acoes" data-id="${t.id}" aria-haspopup="menu" aria-label="Ações do chamado ${t.id}">⋮</button></td>
  </tr>`;
}

function fecharPop(){document.querySelector(".pop")?.remove()}
function abrirPop(btn){
  fecharPop();
  if(btn.dataset.pop==="export"){                 // menu Exportar dos Painéis de incidentes
    const e=btn.dataset.esc, nm=e==="op"?"Operadoras":"Plataformas";
    const p=document.createElement("div"); p.className="pop"; p.setAttribute("role","menu");
    p.innerHTML=`<button role="menuitem" data-act="histExport" data-esc="${e}"><span class="row" style="gap:8px;flex-wrap:nowrap">${ICO_XLS}Exportar este painel</span><small>Resumo + aba ${nm}</small></button><button role="menuitem" data-act="histExport" data-esc="tudo"><span class="row" style="gap:8px;flex-wrap:nowrap">${ICO_XLS}Exportar tudo</span><small>Resumo, Operadoras e Plataformas</small></button>`;
    document.body.appendChild(p); const r=btn.getBoundingClientRect();
    p.style.top=(r.bottom+window.scrollY+6)+"px"; const w=p.offsetWidth; p.style.left=((r.left+w<=window.innerWidth-8)?r.left:Math.max(8,r.right-w))+window.scrollX+"px"; p.querySelector("button").focus(); return;
  }
  const t=tk(btn.dataset.id); if(!t) return;
  const tipo=btn.dataset.pop; let itens=[];
  const it=(label,act,extra={})=>`<button role="menuitem" class="${extra.cls||""}" data-act="${act}" data-id="${t.id}" ${extra.val!==undefined?`data-val="${esc(extra.val)}"`:""} ${extra.dis?"disabled":""}>${label}${extra.hint?`<small>${extra.hint}</small>`:""}</button>`;
  if(tipo==="status"){
    itens=STATUS.map(s=>{const tr=transicao(t,s);
      return s===t.status ? it(pill(s)+' <span class="muted small">atual</span>',"setStatus",{val:s,dis:true})
        : it(pill(s),"setStatus",{val:s,dis:!tr.ok,hint:tr.ok?(tr.act==="resolver"?"Pede a solução aplicada":tr.act==="encerrarDireto"?"Diamante · pede o motivo":tr.act==="reabrir"?"Pede o motivo":""):tr.motivo})});
  } else if(tipo==="resp"){
    itens=[it("Fila geral (sem responsável)","setResp",{val:"—",dis:t.resp==="—"}), ...elegiveis(t).map(u=>it(`${esc(u.nome)} <span class="muted small">${esc(u.nivel)}</span>`,"setResp",{val:u.nome,dis:u.nome===t.resp}))];
  } else {
    const enc=t.status==="Encerrado", ex=!!t.excluido, trat=!ex&&podeChamado("tratar",t);
    itens.push(it("Abrir chamado","abrir"));
    if(trat&&!enc) itens.push(it("Atribuir responsável","atribuir"));
    if(trat) itens.push(it("Alterar status","alterarStatus"));
    if(trat&&t.status==="Em análise") itens.push(it("Marcar como resolvido","resolver"));
    if(trat&&!enc) itens.push(it(t.flags.atipico?"Remover marcação de atípico":"Marcar como atípico","atipico"));
    if(!ex&&!enc&&podeChamado("retorno",t)) itens.push(it("Preparar retorno ao cliente","retornoPrep"));
    itens.push(it("Extrair em PDF","pdf"));
    if(!ex&&podeChamado("excluir",t)) itens.push('<hr>',it("Excluir chamado","excluir",{cls:"danger"}));
  }
  const p=document.createElement("div"); p.className="pop"; p.setAttribute("role","menu"); p.innerHTML=itens.join("");
  document.body.appendChild(p);
  const r=btn.getBoundingClientRect(), w=p.offsetWidth, h=p.offsetHeight;
  let left=r.left+window.scrollX; if(tipo==="acoes") left=r.right+window.scrollX-w;
  left=Math.max(8,Math.min(left,window.scrollX+document.documentElement.clientWidth-w-8));
  let top=r.bottom+window.scrollY+4; if(r.bottom+h+8>window.innerHeight && r.top-h-4>0) top=r.top+window.scrollY-h-4;
  p.style.left=left+"px"; p.style.top=top+"px";
  p.querySelector("button:not([disabled])")?.focus();
}

/* ============ Registro de chamados (01/10) ============
   Substitui a planilha da equipe. Obrigatórios: Usuário (quem está registrando, automático), Cliente, CNPJ ou CPF, Operadora e Equipamento.
   Permissões: Bronze só cria · Prata e Ouro criam e editam · Diamante também exclui. */
const RC_REDES = ["4G","2G"];
const soDig = v => (v||"").replace(/\D/g,"");
const fmtDoc = v => { const d=soDig(v); if(d.length===11) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,"$1.$2.$3-$4"); if(d.length===14) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5"); return (v||"").trim(); };
const rcChips = v => [...new Set((v||"").split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))];
const rcChipRuim = n => !/^\d+$/.test(n) || ![12,13,19,20].includes(n.length);     // mesma regra da Abertura (item 47)
const rcTipo = n => n.length>=19 ? "ICCID" : "MSISDN";
const rcDe = id => S.regCham.find(r=>r.id===id);
function rcFiltrados(){
  const q=(S.rcQ||"").trim().toLowerCase(), qd=soDig(q);
  return S.regCham.filter(r=>(!S.rcOp||r.operadora===S.rcOp) && (!q ||
    [r.cliente,r.doc,r.equip,r.regiao,r.usuario,r.id,r.comandos].some(x=>(x||"").toLowerCase().includes(q)) ||
    (qd.length>=4 && (soDig(r.doc).includes(qd) || r.chips.some(c=>c.includes(qd))))));
}
function rcForm(r){
  const ed=!!r, v=r||{}, eqs=[...new Set(S.regCham.map(x=>x.equip).filter(Boolean))].sort(), regs=[...new Set(S.regCham.map(x=>x.regiao).filter(Boolean))].sort();
  const opt=(lista,val)=>lista.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("");
  const radios=(nome,lista,val)=>`<div class="weeks rcseg" role="radiogroup" aria-label="${nome}">${lista.map(o=>`<button type="button" role="radio" aria-checked="${o===val}" class="${o===val?"on":""}" data-rcseg="${nome}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div><input type="hidden" id="rc${nome}" value="${esc(val||"")}">`;
  return `<form class="card pad stack" id="fRC" novalidate>
    <div class="row" style="justify-content:space-between"><h2>${ed?`Editar registro <span class="mono">${esc(r.id)}</span>`:"Novo registro"}</h2><span class="small muted"><span style="color:var(--atrasado)">*</span> obrigatório</span></div>
    <p class="small muted" style="margin-top:-6px">Informações para abertura de chamado de instabilidade. Elas ajudam a equipe a identificar a causa da instabilidade, realizar as verificações necessárias e dar um retorno mais rápido ao cliente.</p>
    <div class="grid2">
      <div class="field"><label for="rcUsr">Usuário <i>*</i></label><input class="in" id="rcUsr" value="${esc(ed?v.usuario:me().nome)}" disabled><span class="hint">${ed?`Quem criou o registro, em ${esc(v.em)}.`:"Quem está registrando. Preenchido automaticamente."}</span></div>
      <div class="field"><label for="rcOp">Operadora <i>*</i></label><select class="in" id="rcOp" required><option value="">Selecione</option>${opt(OPERADORAS(),v.operadora)}</select><span class="hint">Identificar qual operadora está apresentando a instabilidade.</span></div>
      <div class="field" style="grid-column:1/-1"><label for="rcCli">Cliente <i>*</i></label><input class="in" id="rcCli" required list="rcCliL" autocomplete="off" value="${esc(v.cliente||"")}" placeholder="Identificar quem está reportando o problema para facilitar o acompanhamento e retorno." title="Identificar quem está reportando o problema para facilitar o acompanhamento e retorno."><datalist id="rcCliL">${S.clientes.map(c=>`<option value="${esc(c.nome)}">${esc(c.doc)}</option>`).join("")}</datalist>
        <span class="hint" id="rcCliHint">Se o cliente já estiver cadastrado, o CNPJ ou CPF é preenchido sozinho.</span></div>
      <div class="field"><label for="rcDoc">CNPJ ou CPF <i>*</i></label><input class="in mono" id="rcDoc" required inputmode="numeric" maxlength="18" value="${esc(v.doc||"")}" placeholder="00.000.000/0000-00 ou 000.000.000-00"></div><div class="rcvazio" aria-hidden="true"></div>
      <div class="field" style="grid-column:1/-1"><label for="rcChips">ICCID ou MSISDN</label><textarea class="in mono" id="rcChips" placeholder="Identificar a linha afetada e permitir verificações junto à operadora e acompanhamento da conexão.&#10;Um por linha, ou separados por vírgula." style="min-height:96px">${esc((v.chips||[]).join("\n"))}</textarea>
        <span class="hint" id="rcChipsHint">Só números: MSISDN com 12 ou 13 dígitos (55 + DDD + número) ou ICCID com 19 ou 20. Pode colar vários de uma vez, direto da planilha.</span></div>
      <div class="field"><label>Rede</label>${radios("Rede",RC_REDES,v.rede)}<span class="hint">Informar a tecnologia utilizada, como 2G ou 4G, para verificar possíveis problemas de cobertura ou compatibilidade.</span></div>
      <div class="field"><label>Recebe SMS</label>${radios("Sms",["Sim","Não"],v.sms)}<span class="hint">Verificar se a linha está conectada à rede e recebendo SMS normalmente.</span></div>
      <div class="field" style="grid-column:1/-1"><label for="rcEq">Equipamento <i>*</i></label><input class="in" id="rcEq" required list="rcEqL" autocomplete="off" value="${esc(v.equip||"")}" placeholder="Informar o modelo do equipamento para verificar a tecnologia utilizada e possíveis configurações ou comandos necessários." title="Informar o modelo do equipamento para verificar a tecnologia utilizada e possíveis configurações ou comandos necessários."><datalist id="rcEqL">${eqs.map(o=>`<option value="${esc(o)}">`).join("")}</datalist></div>
      <div class="field" style="grid-column:1/-1"><label for="rcReg">Região</label><input class="in" id="rcReg" list="rcRegL" autocomplete="off" value="${esc(v.regiao||"")}" placeholder="Informar onde a instabilidade está ocorrendo para verificar possíveis problemas de cobertura ou incidentes na região." title="Informar onde a instabilidade está ocorrendo para verificar possíveis problemas de cobertura ou incidentes na região."><datalist id="rcRegL">${regs.map(o=>`<option value="${esc(o)}">`).join("")}</datalist></div>
      <div class="field" style="grid-column:1/-1"><label for="rcCmd">Comandos</label><textarea class="in mono" id="rcCmd" placeholder="Informar os comandos utilizados no equipamento para auxiliar na análise e identificar possíveis problemas de configuração." style="min-height:90px">${esc(v.comandos||"")}</textarea></div>
    </div>
    <div class="row" style="justify-content:space-between"><span id="rcErr" class="errtxt"></span>
      <span class="row">${ed?`<button type="button" class="btn" data-act="rcCancelar">Cancelar</button>`:`<button type="button" class="btn" data-act="rcLimpar">Limpar</button>`}<button class="btn primary">${ed?"Salvar alterações":"Salvar registro"}</button></span></div>
  </form>`;
}
function vRegCham(){

  return `<div class="page">

      <td>${esc(r.equip)}</td><td style="white-space:nowrap">${esc(r.rede||"—")} · <span class="small muted">SMS</span> ${esc(r.sms||"—")}</td><td>${esc(r.regiao||"—")}</td>

      || `<tr><td colspan="7"><div class="empty">${S.regCham.length?"Nenhum registro encontrado com esses filtros.":"Nenhum registro ainda. Crie o primeiro em Incidentes › Registro de chamados."}</div></td></tr>`}

    <p class="hint pad" style="padding-top:8px">${lista.length} de ${S.regCham.length} registro${S.regCham.length===1?"":"s"}. Clique numa linha para ver todos os dados, copiar os comandos${pode("regcham.editar")?", editar":""}${pode("regcham.excluir")?" ou excluir":""}.</p>

    <div class="row" style="justify-content:space-between"><h2>Registro <span class="mono">${esc(r.id)}</span></h2><span class="row" style="gap:6px">${opMarca(r.operadora,20)}<b>${esc(r.operadora)}</b></span></div>

      ${lin("Cliente",esc(r.cliente))}${lin("CNPJ ou CPF",esc(r.doc),1)}

      ${lin("Rede",esc(r.rede||"—"))}${lin("Recebe SMS",esc(r.sms||"—"))}
      ${lin("Região",esc(r.regiao||"—"))}${r.editadoPor?lin("Última edição",esc(r.editadoPor)+` · <span class="mono">${esc(r.editadoEm)}</span>`):"<div></div>"}
    </div>
    <div><div class="row" style="justify-content:space-between"><span class="label">Chips (${r.chips.length})</span>${r.chips.length?`<button class="btn sm" data-rccopy="chips">Copiar</button>`:""}</div>

  ws.getRow(1).font={bold:true,color:{argb:"FFFFFFFF"}}; ws.getRow(1).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1E4FD6"}}; ws.getRow(1).height=22;
  ws.getColumn("iccid").numFmt="@"; ws.getColumn("msisdn").numFmt="@"; ws.getColumn("comandos").alignment={wrapText:true,vertical:"top"};
  ws.autoFilter={from:{row:1,column:1},to:{row:1,column:13}};

  a.download=`registro-de-chamados-${new Date(agora()).toISOString().slice(0,10)}.xlsx`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function rcSalvar(){
  const f=$("#fRC"); if(!f) return;
  const editando=S.rcEdit&&rcDe(S.rcEdit);
  if(editando ? !pode("regcham.editar") : !pode("inc-chamados")){toast("Você não tem permissão para esta ação");return}
  f.querySelectorAll(".err").forEach(x=>x.classList.remove("err")); $("#rcErr").textContent="";
  const req=["#rcOp","#rcCli","#rcDoc","#rcEq"].map(s=>$(s)), vazio=req.filter(i=>!i.value.trim());
  if(vazio.length){vazio.forEach(i=>i.classList.add("err"));$("#rcErr").textContent="Preencha os campos obrigatórios: Operadora, Cliente, CNPJ ou CPF e Equipamento.";vazio[0].focus();return}
  const d=soDig($("#rcDoc").value);
  if(![11,14].includes(d.length)){$("#rcDoc").classList.add("err");$("#rcErr").textContent="CNPJ ou CPF inválido: use 14 dígitos (CNPJ) ou 11 (CPF).";$("#rcDoc").focus();return}
  const chips=rcChips($("#rcChips").value), ruins=chips.filter(rcChipRuim);
  if(ruins.length){$("#rcChips").classList.add("err");$("#rcErr").textContent=`Número inválido: ${ruins.slice(0,5).join(", ")}${ruins.length>5?"…":""}. Use só números: MSISDN com 12 ou 13 dígitos ou ICCID com 19 ou 20.`;$("#rcChips").focus();return}
  const dados={cliente:$("#rcCli").value.trim(), doc:fmtDoc(d), operadora:$("#rcOp").value, chips, rede:$("#rcRede").value, equip:$("#rcEq").value.trim(), sms:$("#rcSms").value, regiao:$("#rcReg").value.trim(), comandos:$("#rcCmd").value.trim()};
  if(editando){ Object.assign(editando, dados, {editadoPor:me().nome, editadoEm:stamp()}); S.rcEdit=null; go("inc-relacao"); toast(`Registro ${editando.id} atualizado`); return; }
  const r={id:"NOVO-RC-"+ejdUid(), em:stamp(), usuario:me().nome, ...dados};
  S.regCham.unshift(r); render(); toast(`Registro ${r.id} salvo${chips.length?` · ${chips.length} chip${chips.length>1?"s":""}`:""} · veja em Relação de chamados`);
}
function rcWire(){
  if(S.route!=="inc-chamados" && S.route!=="inc-relacao") return;
  const b=$("#rcBusca"); if(b) b.addEventListener("input",()=>{S.rcQ=b.value;const fr=$("#fRC"),keep=rcRascunho();render();rcRestaura(keep);const n=$("#rcBusca");n.focus();n.setSelectionRange(n.value.length,n.value.length)});
  const fo=$("#rcFOp"); if(fo) fo.addEventListener("change",()=>{S.rcOp=fo.value;const keep=rcRascunho();render();rcRestaura(keep)});
  const cl=$("#rcCli"), dc=$("#rcDoc");
  if(cl) cl.addEventListener("change",()=>{const c=S.clientes.find(x=>x.nome.toLowerCase()===cl.value.trim().toLowerCase()); if(c&&!dc.value.trim()){dc.value=c.doc;$("#rcCliHint").innerHTML=`Cliente cadastrado · CNPJ/CPF preenchido com <span class="mono">${esc(c.doc)}</span>.`}});
  if(dc){ dc.addEventListener("blur",()=>{dc.value=fmtDoc(dc.value); const c=S.clientes.find(x=>soDig(x.doc)===soDig(dc.value)); if(c&&!cl.value.trim()) cl.value=c.nome;}); }
  const ch=$("#rcChips"), hint=$("#rcChipsHint"), base=hint&&hint.textContent;
  if(ch) ch.addEventListener("input",()=>{const l=rcChips(ch.value), r=l.filter(rcChipRuim); hint.textContent = l.length ? `${l.length} chip${l.length>1?"s":""}${r.length?` · ${r.length} com formato inválido`:""} · ${l.filter(x=>rcTipo(x)==="ICCID").length} ICCID, ${l.filter(x=>rcTipo(x)==="MSISDN").length} MSISDN` : base; hint.style.color=r.length?"var(--atrasado)":""});
}

/* Ordem: operadoras M2M em ordem alfabética; as BL no final da lista. */
const OPERADORAS = () => { const all=[...new Set(CASOS.map(operadoraDe).filter(Boolean))], az=a=>a.sort((x,y)=>x.localeCompare(y,"pt-BR"));
  return az(all.filter(o=>!/\sBL$/.test(o))).concat(az(all.filter(o=>/\sBL$/.test(o)))); };
/* Gráfico geral (28/09): todas as operadoras em % da base, por turno. Só entra quem tem base cadastrada.
   Clique no card da operadora = só ela; chips da legenda = seleção de várias. */
function graficoGeral(ops){
  const comBase=ops.filter(o=>!isBL(o)&&S.incBase[o]), semBase=ops.filter(o=>!isBL(o)&&!S.incBase[o]);
  const filtro=(S.incFiltro||[]).filter(o=>comBase.includes(o)), vis=filtro.length?filtro:comBase;
  const ult=o=>S.incidentes.filter(r=>r.operadora===o).sort(ordReg).pop();
  const agoraInst=ops.map(o=>{const u=ult(o), n=u&&nivelDe(u);return n&&n.k!=="normal"?{o,n}:null}).filter(Boolean);
  const chips=`<div class="chips" role="group" aria-label="Filtrar operadoras"><button class="chip ${filtro.length?"":"on"}" data-gfil="*">Todas</button>${comBase.map(o=>`<button class="chip ${filtro.includes(o)?"on":""}" data-gfil="${esc(o)}" style="--c:${opCor(o)}" aria-pressed="${filtro.includes(o)}">${opMarca(o,16)}${esc(o)}</button>`).join("")}</div>`;
  const cab=`<div class="row" style="justify-content:space-between"><h2>Gráfico geral das operadoras</h2>${agoraInst.length?`<span class="row" style="gap:6px">${agoraInst.map(x=>`<span class="pill ${x.n.cls}">${esc(x.o)} · ${esc(x.n.nome)}</span>`).join("")}</span>`:comBase.length?`<span class="pill n-normal">Todas normais no último registro</span>`:""}</div>`;
  if(!comBase.length) return `<section class="card pad stack">${cab}<div class="empty">O gráfico geral usa o <b>Registro de base</b>. Ele aparece quando a base das operadoras estiver preenchida.<br><button class="btn sm" data-go="inc-base" style="margin-top:10px">Ir para Registro de base</button></div></section>`;
  const regs=S.incidentes.filter(r=>vis.includes(r.operadora)&&!r.antigo);   // exemplos antigos (aviso de 3 meses) ficam fora do gráfico
  const slots=[...new Set(regs.map(r=>r.dia+"|"+r.turno))].sort((a,b)=>{const[x,y]=a.split("|"),[z,w]=b.split("|");return x<z?-1:x>z?1:ORD_TURNO[y]-ORD_TURNO[w]}).slice(-9);
  let svg=`<div class="empty">Sem registros das operadoras selecionadas.</div>`;
  if(slots.length){
    const W=760,H=240,P={l:46,r:18,t:14,b:40};
    const vals=regs.filter(r=>slots.includes(r.dia+"|"+r.turno)).map(pct);
    const lo=Math.max(0,Math.floor(Math.min(65,...vals)/5)*5), hi=Math.max(105,Math.ceil(Math.max(...vals)/5)*5);
    const xs=i=>P.l+(slots.length===1?(W-P.l-P.r)/2:i*(W-P.l-P.r)/(slots.length-1)), ys=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));
    const ticks=[lo,70,85,95,100,hi].filter((v,i,a)=>v>=lo&&a.indexOf(v)===i).sort((a,b)=>a-b);
    const faixas=[[100,95,"normal"],[95,85,"atencao"],[85,70,"possivel"],[70,lo,"instab"]].filter(f=>f[0]>lo);
    const linhas=vis.map(o=>{const pts=slots.map((sl,i)=>{const[d,t]=sl.split("|");const r=S.incidentes.find(x=>x.operadora===o&&x.dia===d&&x.turno===t);return r?{i,r}:null}).filter(Boolean);
      if(!pts.length) return "";
      return `<g><polyline points="${pts.map(p=>xs(p.i).toFixed(1)+","+ys(pct(p.r)).toFixed(1)).join(" ")}" fill="none" stroke="${opCor(o)}" stroke-width="2"/>
        ${pts.map(p=>{const n=nivelDe(p.r), alerta=n&&n.k!=="normal";return `<circle cx="${xs(p.i)}" cy="${ys(pct(p.r))}" r="${alerta?5:3.5}" fill="${opCor(o)}" ${alerta?`stroke="${NIVEL_COR[n.k]}" stroke-width="2.5"`:""}><title>${esc(o)} · ${esc(p.r.dia.slice(8,10)+"/"+p.r.dia.slice(5,7))} ${TURNOS[p.r.turno].nome} · ${p.r.linhas.toLocaleString("pt-BR")} de ${baseDe(p.r).toLocaleString("pt-BR")} (${pct(p.r)}%, queda de ${queda(p.r)}%) · ${n?n.nome:""}</title></circle>`}).join("")}</g>`}).join("");
    svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Linhas online em % da base, por turno" style="width:100%;height:auto">
      ${ticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${P.l-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${v}%</text>`).join("")}
      ${faixas.map(([a,b,k])=>`<rect x="${P.l}" y="${ys(a)}" width="${W-P.l-P.r}" height="${Math.max(0,ys(Math.max(b,lo))-ys(a))}" fill="${NIVEL_COR[k]}" opacity=".07"/><text x="${W-P.r-4}" y="${ys(a)+12}" text-anchor="end" font-size="10" fill="${NIVEL_COR[k]}">${esc(NIVEIS_INC.find(n=>n.k===k).nome)}</text>`).join("")}
      ${linhas}
      ${slots.map((sl,i)=>{const[d,t]=sl.split("|");return `<text x="${xs(i)}" y="${H-22}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="var(--mono)">${d.slice(8,10)}/${d.slice(5,7)}</text><text x="${xs(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${TURNOS[t].curto}</text>`}).join("")}
    </svg>`;
  }
  return `<section class="card pad stack">${cab}
    ${chips}
    ${svg}
    <p class="hint">Cada linha mostra as linhas online da operadora em % da própria base (a base do dia do registro), turno a turno. Faixas pela queda: Normal até 5% · Atenção até 15% · Possível instabilidade até 30% · Instabilidade acima de 30%. Clique num card acima para ver só aquela operadora, ou selecione várias aqui na legenda. As operadoras BL ficam fora do gráfico, porque a situação delas é informada manualmente.${semBase.length?` Sem base cadastrada: ${semBase.map(esc).join(", ")}.`:""}</p>
  </section>`;
}

/* Análise do mês (pedido do Patrick Moura, 29/09): quanto cada operadora costuma cair,
   para decidir se uma queda de, por exemplo, 1.000 linhas na Algar ou 200 na Claro é normal. */
function analiseMes(ops){
  const d=new Date(agora()), ini=diaISO(new Date(d.getFullYear(),d.getMonth(),1).getTime()), rot=MESES[d.getMonth()]+"/"+d.getFullYear();
  const linhas=ops.filter(o=>!isBL(o)).map(o=>{const rr=S.incidentes.filter(r=>r.operadora===o&&r.dia>=ini&&queda(r)!=null);
    if(!rr.length) return `<tr><td><span class="row" style="gap:6px;flex-wrap:nowrap">${opMarca(o,18)}${esc(o)}</span></td><td colspan="6" class="small muted">Sem registros com base neste mês</td></tr>`;
    const qs=rr.map(queda), perd=rr.map(r=>Math.max(0,baseDe(r)-r.linhas)), med=qs.reduce((a,b)=>a+b,0)/qs.length;
    const cont=k=>rr.filter(r=>nivelDe(r).k===k).length, mx=rr.reduce((a,r)=>queda(r)>queda(a)?r:a);
    return `<tr><td><span class="row" style="gap:6px;flex-wrap:nowrap">${opMarca(o,18)}${esc(o)}</span></td><td class="mono">${rr.length}</td>
      <td class="mono">${med.toFixed(1).replace(".",",")}% <span class="small muted">(${Math.round(perd.reduce((a,b)=>a+b,0)/perd.length).toLocaleString("pt-BR")} linhas)</span></td>
      <td class="mono">${String(queda(mx)).replace(".",",")}% <span class="small muted">${esc(mx.dia.slice(8,10)+"/"+mx.dia.slice(5,7))} ${TURNOS[mx.turno].curto}</span></td>
      ${NIVEIS_INC.map(n=>`<td class="mono" style="${cont(n.k)&&n.k!=="normal"?`color:${NIVEL_COR[n.k]};font-weight:600`:""}">${cont(n.k)}</td>`).join("")}</tr>`}).join("");
  return `<section class="card pad stack"><div class="row" style="justify-content:space-between"><h2>Análise do mês · ${rot}</h2><span class="small muted">o que é queda normal para cada operadora</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Operadora</th><th>Registros</th><th>Queda média</th><th>Maior queda</th>${NIVEIS_INC.map(n=>`<th title="${esc(n.nome)}">${({normal:"Normal",atencao:"Atenção",possivel:"Possível",instab:"Instab."})[n.k]}</th>`).join("")}</tr></thead><tbody>${linhas}</tbody></table></div>
    <p class="hint">Queda = quanto faltou para chegar à base do dia. Se uma operadora vive em "Atenção" sem problema real, a faixa dela pode ser ajustada (revisão das faixas após 1 mês). BL fica fora, porque a situação é manual.</p></section>`;
}
function vIncidentes(modo="painel"){
  limparHistorico();
  const ops=OPERADORAS(), abertos=S.tickets.filter(t=>!t.excluido && podeChamado("ver",t) && !["Resolvido","Encerrado"].includes(t.status));
  const porOp=Object.fromEntries(ops.map(o=>[o,abertos.filter(t=>operadoraDe(t.caso)===o)]));
  const max=Math.max(1,...ops.map(o=>porOp[o].length));
  const sel=S.incOp && ops.includes(S.incOp) ? S.incOp : (ops.find(o=>S.incidentes.some(r=>r.operadora===o))||ops[0]);
  const regsOp=S.incidentes.filter(r=>r.operadora===sel).sort(ordReg);
  const podeReg=pode("incidentes.registrar"), podeBase=pode("incidentes.base");

/* ============ Painel de incidentes 2 — plataformas (esboço, 29/09) ============
   Status informado manualmente pela equipe. Links sem parâmetros de sessão (os do pedido expiram). */
const PLATAFORMAS = [

];
const PSTATUS = {normal:{nome:"Normal", cls:"s-Resolvido", peso:0}, instavel:{nome:"Instabilidade", cls:"s-Em", peso:1}, fora:{nome:"Fora do ar", cls:"s-Instavel", peso:2}};
const platAtiva = id => S.incPlat.filter(x=>x.plat===id && !x.fim).sort((a,b)=>PSTATUS[b.status].peso-PSTATUS[a.status].peso)[0];
const platSigla = n => n.replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase();
const platNome = id => PLATAFORMAS.find(p=>p.id===id)?.nome||id;

/* Histórico de incidentes: guardado por 3 meses (29/09). Prazo, aviso e arquivo automático a decidir. */
const RET_MESES = 3, AVISO_DIAS = 7;
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const somaMeses = (ms,n) => {const d=new Date(ms);d.setMonth(d.getMonth()+n);return d.getTime()};
const msDia = iso => new Date(iso+"T00:00:00").getTime();
const brMs = str => {const m=/(\d{2})\/(\d{2})\/(\d{4})(?: (\d{2}):(\d{2}))?/.exec(str||"");return m?new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)).getTime():0};
const platIni = x => x.inicioMs || brMs(x.inicio);
const platFim = x => x.fim ? (x.fimMs>1e12 ? x.fimMs : brMs(x.fim)) : null;
const refOp = r => msDia(r.dia);                  // Painel 1: dia do registro
const refPlat = x => platFim(x);                  // Painel 2: data de normalização (em andamento não vence)
const venceEm = ref => ref==null ? Infinity : somaMeses(ref, RET_MESES);
const histOp = () => S.incidentes.filter(instavel).sort(ordReg).reverse();
const histPlat = () => S.incPlat.slice().sort((a,b)=>platIni(b)-platIni(a));
function limparHistorico(){                       // rotina de retenção (no real, roda no servidor)
  const t=agora(), a=S.incidentes.length+S.incPlat.length;
  S.incidentes=S.incidentes.filter(r=>venceEm(refOp(r))>t);
  S.incPlat=S.incPlat.filter(x=>venceEm(refPlat(x))>t);
  return a-(S.incidentes.length+S.incPlat.length);
}
const vencendo = escopo => { const t=agora(), lim=t+AVISO_DIAS*86400000, ok=ref=>{const v=venceEm(ref);return v>t&&v<=lim};
  return {op: escopo==="plat"?[]:histOp().filter(r=>ok(refOp(r))), plat: escopo==="op"?[]:S.incPlat.filter(x=>ok(refPlat(x)))}; };
function avisoRetencao(escopo){
  const v=vencendo(escopo), n=v.op.length+v.plat.length;
  const desde=new Date(somaMeses(agora(),-RET_MESES)).toLocaleDateString("pt-BR");
  const prox=[...v.op.map(r=>venceEm(refOp(r))),...v.plat.map(x=>venceEm(refPlat(x)))].sort((a,b)=>a-b)[0];
  return n ? `<div class="note warn-ret"><div><b>${n} incidente${n>1?"s":""} ${n>1?"completam":"completa"} 3 meses ${prox?`em ${new Date(prox).toLocaleDateString("pt-BR")}`:"em breve"}</b> e ${n>1?"serão apagados":"será apagado"} da plataforma. Exporte o histórico antes para guardar no Excel.</div><button class="btn sm primary" data-act="histExport" data-esc="${escopo==="plat"?"plat":escopo==="op"?"op":"tudo"}">${ICO_XLS}Exportar agora</button></div>`
    : `<p class="hint">A plataforma guarda o histórico dos últimos 3 meses (desde ${desde}). Os mais antigos são apagados; avisamos ${AVISO_DIAS} dias antes.</p>`;
}
function arquivoMensal(){
  const d=new Date(agora()), meses=[];
  for(let i=0;i<=RET_MESES;i++){const m=new Date(d.getFullYear(),d.getMonth()-i,1);meses.push(m)}
  const lim=somaMeses(agora(),-RET_MESES);
  return `<section class="card pad stack"><div class="row" style="justify-content:space-between"><h2>Arquivo mensal em Excel</h2><span class="small muted">baixar todo dia 1</span></div>
    <p class="small muted">Todo dia 1, baixe aqui o Excel do mês anterior (${PLATAFORMAS_ATIVO?"Resumo, Operadoras e Plataformas":"Resumo e Operadoras"}) e salve na pasta compartilhada do Suporte. A gravação automática na pasta fica para quando houver integração com a Microsoft.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Mês</th><th>Situação</th><th></th></tr></thead><tbody>
    ${meses.map((m,i)=>{const ini=m.getTime(), fim=new Date(m.getFullYear(),m.getMonth()+1,1).getTime(), rot=MESES[m.getMonth()]+"/"+m.getFullYear(), ger=new Date(fim).toLocaleDateString("pt-BR");
      const parcial=ini<lim;
      return `<tr><td><b>${rot}</b></td><td class="small">${i===0?`Em andamento · disponível em ${ger}`:`Disponível desde ${ger}${parcial?' <span class="muted">· nesta tela só restam os dias ainda guardados</span>':""}`}</td>
        <td style="text-align:right">${i===0?"":`<button class="btn sm" data-act="histExport" data-esc="tudo" data-de="${ini}" data-ate="${fim}" data-rot="${rot.replace("/","-")}">${ICO_XLS}Baixar Excel</button>`}</td></tr>`}).join("")}

const ICO_XLS = `<svg class="ico-xls" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2" y="2" width="16" height="16" rx="3" fill="#1D7A45"/><path d="M5.5 7h9M5.5 10h9M5.5 13h9M9 5.5v9" stroke="#fff" stroke-width="1.3" opacity=".9"/></svg>`;
const botoesExport = esc => !PLATAFORMAS_ATIVO ? `<button class="btn" data-act="histExport" data-esc="op" title="Resumo + aba Operadoras">${ICO_XLS}Exportar</button>` : `<button class="btn" data-pop="export" data-esc="${esc}" aria-haspopup="menu">${ICO_XLS}Exportar <span class="car">▾</span></button>`;

/* Exportação em Excel (ExcelJS, carregado só no clique). */
const carregarExcelJS = () => window.ExcelJS ? Promise.resolve() : new Promise((ok,er)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";sc.onload=ok;sc.onerror=er;document.head.appendChild(sc)});
const xData = ms => {const d=new Date(ms);return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes()))};
async function exportarHistorico(escopo, per={}){
  if(!PLATAFORMAS_ATIVO) escopo="op";              // Painel 2 oculto: exporta só operadoras

function render(){

  // Guarda única de rota: menu, clique e URL passam por aqui.
  fecharPop();
  // Guarda única: páginas por pode(); chamado pelo setor responsável dele, via podeChamado().
  const negado = S.route==="detalhe" ? !podeChamado("ver", tk(S.sel)) : (!VIEWS[S.route] || !pode(S.route));
  const cur = S.route==="detalhe" && !negado ? voltarPara(tk(S.sel)) : S.route;
  root.innerHTML = `<div class="app${S.sideHidden?" collapsed":""}"><button class="sidebar-bar" data-side="toggle" aria-label="${S.sideHidden?"Mostrar menu":"Ocultar menu"}" title="${S.sideHidden?"Mostrar menu":"Ocultar menu"}" aria-expanded="${!S.sideHidden}"><span class="sb-grip" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg><span class="sb-txt"></span></span></button>${railHTML(cur)}
    <aside class="side" aria-label="Menu">
      <div class="brand"><div class="mark">EJ</div><div><b>E.J. Desk</b><small>Meta Telecom</small></div></div>
      <div class="sim"><span class="label" style="color:var(--side-muted)">Ver protótipo como</span>
        <select class="in" id="simUser" aria-label="Usuário simulado" style="background:#1B2638;border-color:#243047;color:#fff;padding:5px 8px;font-size:12.5px">${S.users.filter(u=>!u.desativado||u.id===S.me).map(u=>`<option value="${u.id}" ${u.id===S.me?"selected":""}>${esc(u.nome)} · ${esc(SETORES[u.setor]?.nome||"")}</option>`).join("")}</select>
        ${Object.keys(SETORES).length<2?"":`<div class="seg" role="group" aria-label="Setor simulado">${Object.entries(SETORES).map(([k,v])=>`<button data-setor="${k}" class="${k===S.setor?"on":""}">${v.nome}</button>`).join("")}</div>`}
        <div class="seg" role="group" aria-label="Nível simulado">${Object.keys(LV).map(l=>`<button data-lv="${l}" class="${l===S.level?"on":""}">${l}</button>`).join("")}</div></div>
      <nav class="nav">${menuHTML(cur)}</nav>
      <div class="me">${avatarHTML(me())}<div class="who"><b>${esc(me().nome)}</b><span>${S.level} · ${esc(SETORES[S.setor].nome)}</span></div><button class="linkbtn" data-act="sair">Sair</button></div>
    </aside>
    <div style="min-width:0">
      <div class="top"><button aria-label="Abrir menu" data-menu><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b>E.J. Desk</b><span class="small" style="margin-left:auto;opacity:.7">${esc(SETORES[S.setor].nome)} · ${S.level}</span></div>
      <main class="main">${negado?vNegado():VIEWS[S.route]()}</main>

function wire(){
  const flb=document.querySelector('label[for="fotoIn"]'); if(flb) flb.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#fotoIn").click()}});
  const fin=$("#fotoIn"); if(fin) fin.addEventListener("change",()=>{const f=fin.files[0];if(!f)return;
    if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast("Use uma imagem JPG, PNG ou WEBP");fin.value="";return}
    if(f.size>5*1024*1024){toast("A imagem passa de 5 MB");fin.value="";return}
    const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{const n=256,c=document.createElement("canvas");c.width=c.height=n;const k=Math.min(img.width,img.height);
      c.getContext("2d").drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,n,n);URL.revokeObjectURL(url);me().foto=c.toDataURL("image/jpeg",.85);salvarFotos();render();toast("Foto atualizada")};
    img.onerror=()=>{URL.revokeObjectURL(url);toast("Não foi possível ler a imagem")};img.src=url});
  const idia=$("#incDia"); if(idia) idia.addEventListener("change",()=>{S.incDia=idia.value;render()});
  const ac=$("#abCaso");
  if(ac) ac.addEventListener("change",()=>{const req=/\b(M2M|BL)$/.test(ac.value);$("#abLinhaReq").hidden=!req;$("#abLinha").required=req});
  const abDupUpd = () => { const box=$("#abDup"); if(!box) return; const d=duplicadosDe({cliente:$("#abCli").value, protAt:$("#abProt").value});
    box.innerHTML = d.length ? `<div class="note"><div><b>Possível chamado repetido.</b> Já existe${d.length>1?"m":""} ${d.length} chamado${d.length>1?"s":""} em aberto: ${d.slice(0,4).map(x=>`<button type="button" class="linkbtn" data-open="${x.t.id}">${x.t.id}</button> (${esc(x.motivo)}, ${esc(x.t.status)})`).join(" · ")}${d.length>4?" …":""}. Você pode abrir mesmo assim; depois, Ouro/Diamante podem juntar os chamados.</div></div>` : ""; };
  if($("#abCli")){ $("#abCli").addEventListener("change",abDupUpd); $("#abProt").addEventListener("input",abDupUpd); }
  const cliSel = $("#abCli");
  if(cliSel) cliSel.addEventListener("change",()=>{const c=S.clientes.find(x=>x.id===cliSel.value);$("#abCliInfo").innerHTML=c?`Retorno irá para <b>${esc(c.email)}</b> · ${esc(c.doc)}${c.tel?" · "+esc(c.tel):""}`:"Os dados de contato vêm do cadastro do cliente."});
  const bq=$("#busca");
  if(bq) bq.addEventListener("input",()=>{lf(S.route).q=bq.value;S.filter=null;render();const n=$("#busca");n.focus();n.setSelectionRange(n.value.length,n.value.length)});
  document.querySelectorAll("[data-f]").forEach(x=>x.addEventListener("change",()=>{const f=lf(S.route);f[x.dataset.f]=x.type==="checkbox"?x.checked:x.value;S.filter=null;render()}));
  const pr=$("#detPrio");
  if(pr) pr.addEventListener("change",()=>{const t=tk(S.sel);if(!podeChamado("tratar",t))return;const ant=t.prioridade||"Normal";t.prioridade=pr.value;registrar(t,`Prioridade alterada de ${ant} para ${pr.value} por ${me().nome}`);render();toast("Prioridade atualizada")});
  document.querySelectorAll("[data-sla]").forEach(x=>x.addEventListener("change",()=>{S.sla=S.sla||{};S.sla[x.dataset.sla]=x.value}));
  const su=$("#simUser");
  if(su) su.addEventListener("change",()=>{const u=S.users.find(x=>x.id===su.value);S.me=u.id;S.level=u.nivel;S.setor=u.setor;toast("Vendo como "+u.nome+" · "+SETORES[u.setor].nome+" · "+u.nivel);go(pode(S.route)?S.route:primeiraRota())});
  const cat = $("#detCat");
  if(cat) cat.addEventListener("change",()=>{const t=tk(S.sel);if(!podeChamado("tratar",t))return;const ant=t.cat;t.cat=cat.value;if(t.setor==="financeiro"){const k=Object.keys(FIN_TIPOS).find(k=>FIN_TIPOS[k].nome===cat.value);if(k)t.tipo=k}registrar(t,`Categoria alterada de ${ant} para ${cat.value} por ${me().nome}`);render();toast("Categoria atualizada")});
}

  const za=e.target.closest("[data-anx]"); if(za){const t=tk(S.sel), a=(t?.arqs||[]).find(x=>x.id===za.dataset.anx); if(a){const v=document.createElement("div");v.className="anx-view";v.setAttribute("role","dialog");v.setAttribute("aria-label",a.nome);

      if(a.tipo==="pdf") mostrarPDF(a, v.querySelector(".anx-pdf"));

      v.querySelectorAll("pre,video,.anx-pdf").forEach(x=>x.addEventListener("click",ev=>ev.stopPropagation()))}return}
  const zd=e.target.closest("[data-anxdl]"); if(zd){const t=tk(S.sel), a=(t?.arqs||[]).find(x=>x.id===zd.dataset.anxdl); if(a) blobDe(a).then(b=>salvarArquivo(a.nome,b)).catch(()=>toast("Arquivo indisponível")); return}
  const el = e.target.closest("[data-side],[data-gfil],[data-fold],[data-turno],[data-incop],[data-pop],[data-rapido],[data-lcard],[data-limpar],[data-tab],[data-go],[data-lv],[data-setor],[data-kpi],[data-week],[data-open],[data-ret],[data-act],[data-clear],[data-dec],[data-menu]");
  if(!el) return;
  if(el.dataset.incop){const o=el.dataset.incop;S.incOp=o;S.incFiltro=(S.incFiltro||[]).length===1&&S.incFiltro[0]===o?[]:[o];render();return}
  if(el.dataset.gfil){const o=el.dataset.gfil;if(o==="*")S.incFiltro=[];else{const f=new Set(S.incFiltro||[]);f.has(o)?f.delete(o):f.add(o);S.incFiltro=[...f]}render();return}
  if(el.dataset.side){S.sideHidden=!S.sideHidden;try{localStorage.setItem("ejd-side",S.sideHidden?"1":"0")}catch(e){}const ap=document.querySelector(".app");if(ap)ap.classList.toggle("collapsed",S.sideHidden);if(S.sideHidden&&window.railEntrada)railEntrada();
    const lab=S.sideHidden?"Mostrar menu":"Ocultar menu";el.setAttribute("aria-label",lab);el.title=lab;el.setAttribute("aria-expanded",!S.sideHidden);return}
  if(el.dataset.fold){const k=el.dataset.fold, abrir=el.getAttribute("aria-expanded")!=="true";S.navOpen[k]=abrir;try{localStorage.setItem("ejd-nav",JSON.stringify(S.navOpen))}catch(e){}
    el.setAttribute("aria-expanded",abrir);el.classList.toggle("open",abrir);const box=el.nextElementSibling;if(box&&box.classList.contains("foldbox"))box.hidden=!abrir;return}
  if(el.dataset.turno){S.incTurno=el.dataset.turno;render();return}
  if(el.dataset.pop){ if(document.querySelector(".pop")&&S._popFor===el){fecharPop();S._popFor=null;return} S._popFor=el; abrirPop(el); return }
  if(el.dataset.rapido){const f=lf(S.route);f.rapido=el.dataset.rapido;S.filter=null;render();return}
  if(el.dataset.lcard){const f=lf(S.route), set=[{status:"",atrasados:false},{status:"Novo",atrasados:false},{status:"Em análise",atrasados:false},{status:"Aguardando retorno",atrasados:false},{status:"",atrasados:true},{status:"Resolvido",atrasados:false}][+el.dataset.lcard];   /* 01/10: um card desmarca o outro (inclusive "Apenas atrasados") */Object.assign(f,set);S.filter=null;render();return}
  if(el.dataset.limpar!==undefined){S.lf[S.route]={...LF_VAZIO};S.filter=null;render();return}
  if(el.dataset.tab){S.tab=el.dataset.tab;render();return}
  if(el.dataset.menu!==undefined){$(".app").classList.toggle("open");return}
  if(el.dataset.dec){go("decisoes");setTimeout(()=>{const d=$("#dec-"+el.dataset.dec);if(d){d.scrollIntoView({block:"center"});d.style.outline="2px solid var(--decidir)";setTimeout(()=>d.style.outline="",1600)}},30);return}
  if(el.dataset.lv){S.level=el.dataset.lv;render();toast("Vendo como "+S.level);return}
  if(el.dataset.setor){S.setor=el.dataset.setor;render();toast("Setor simulado: "+SETORES[S.setor].nome);return}
  if(el.dataset.kpi){const k=KPIS[+el.dataset.kpi];go("chamados",{filter:k.f});return}
  if(el.dataset.week){S.week=el.dataset.week;render();return}
  if(el.dataset.clear!==undefined){S.filter=null;render();return}
  if(el.dataset.go && el.dataset.ret){go("retorno",{retSel:el.dataset.ret});return}
  if(el.dataset.go){go(el.dataset.go, el.dataset.go==="chamados"&&!el.closest(".nav")?{}:{filter:null});return}

  if(el.dataset.act) act(el.dataset.act, el);
