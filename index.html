        ${ops.map((o,i)=>{const r=regDia(o);return `<tr><td><span class="row" style="gap:8px;flex-wrap:nowrap">${opMarca(o,20)}${esc(o)}</span></td>
          <td class="mono">${isBL(o)?'<span class="muted" style="font-family:var(--sans)">manual</span>':S.incBase[o]?S.incBase[o].toLocaleString("pt-BR"):'<span class="muted">sem base</span>'}</td>
          <td>${r?`${r.nivel?'<span class="small muted">—</span>':`<span class="mono">${r.linhas.toLocaleString("pt-BR")}</span>${r.partes?` <span class="small muted">(${Object.entries(r.partes).map(([k,v])=>esc(k)+" "+Number(v).toLocaleString("pt-BR")).join(" + ")})</span>`:""}`} <span class="small muted">registrado por ${pessoa(r.por,16)}</span>`:isBL(o)?`<select class="in" data-incn="${esc(o)}" id="incN${i}" style="max-width:220px;padding:5px 8px"><option value="">— situação —</option>${NIVEIS_INC.map(n=>`<option value="${n.k}">${esc(n.nome)}</option>`).join("")}</select>`:(PARTES_OP[o]?`<div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">${PARTES_OP[o].map((pn,k)=>`<label class="fsel" style="text-transform:none;letter-spacing:0"><span>${esc(pn)}</span><input class="in mono" type="number" min="0" data-incp="${esc(o)}" data-k="${k}" id="incP${i}_${k}" placeholder="—" style="width:120px;padding:5px 8px"></label>`).join('<span class="muted" style="padding-bottom:7px">+</span>')}<span class="small" style="padding-bottom:7px">= <b class="mono" data-inctot="${esc(o)}">—</b></span><input type="hidden" data-incl="${esc(o)}" id="incL${i}" value=""></div>`
            :`<input class="in mono" type="number" min="0" data-incl="${esc(o)}" id="incL${i}" placeholder="—" style="max-width:150px;padding:5px 8px">`)}</td>
          <td>${r?situacao(r):'<span class="small muted">a registrar</span>'}</td></tr>`}).join("")}
      </tbody></table></div>
      <div class="row" style="justify-content:space-between"><span class="errtxt" id="incErr"></span><button class="btn primary">Registrar turno</button></div>
    </form>`:`<p class="small muted">Você pode consultar os registros. O registro de linhas online fica com Prata ou acima.</p>`}
  </section>`:""}

  ${modo==="painel"?`${graficoGeral(ops)}
  <div>
    <section class="card pad stack"><h2>Chamados abertos por operadora</h2>
      <div class="bars">${ops.map(o=>`<div class="bar"><span class="row" style="gap:6px;flex-wrap:nowrap">${opMarca(o,18)}${esc(o)}</span><div class="track"><div class="fill" style="width:${porOp[o].length/max*100}%;background:${opCor(o)}"></div></div><span class="mono" style="text-align:right">${porOp[o].length}</span></div>`).join("")}</div>

  ${(()=>{const h=histOp();return `<section class="card pad stack"><div class="row" style="justify-content:space-between"><h2>Histórico de instabilidades · ${h.length}</h2><span class="small muted">últimos 3 meses · entram ${NIVEIS_HIST.map(k=>NIVEIS_INC.find(n=>n.k===k).nome).join(" e ")}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Dia</th><th>Turno</th><th>Operadora</th><th>Linhas online</th><th>Queda</th><th>Situação</th><th>Registrado por</th><th>Apagado em</th></tr></thead><tbody>
    ${h.map(r=>`<tr><td class="mono">${esc(r.dia.split("-").reverse().join("/"))}</td><td>${TURNOS[r.turno].nome}</td><td><span class="row" style="gap:6px;flex-wrap:nowrap">${opMarca(r.operadora,18)}${esc(r.operadora)}</span></td><td class="mono">${r.nivel?'<span class="small muted" style="font-family:var(--sans)">manual (BL)</span>':`${r.linhas.toLocaleString("pt-BR")} <span class="small muted">de ${baseDe(r).toLocaleString("pt-BR")}</span>`}</td><td class="mono">${r.nivel?"—":queda(r)+"%"}</td><td>${situacao(r)}</td><td>${pessoa(r.por)}</td><td class="mono small">${new Date(venceEm(refOp(r))).toLocaleDateString("pt-BR")}</td></tr>`).join("")||`<tr><td colspan="8"><div class="empty">Nenhuma instabilidade nos últimos 3 meses.${Object.keys(S.incBase).length?"":" Preencha a base em Registro de base para calcular."}</div></td></tr>`}
    </tbody></table></div></section>`})()}
  ${arquivoMensal()}`:""}

  ${modo==="base"?`<section class="card pad stack"><div class="row" style="justify-content:space-between"><h2>Base de linhas por operadora</h2><span class="small muted">${baseInfo}</span></div>
    <p class="small muted">A base é a quantidade de linhas M2M ativas de cada operadora. O Diamante atualiza uma vez por mês. Cada registro de turno guarda a base daquele dia, então mudar a base não altera o histórico. As operadoras BL não usam base: a situação delas é escolhida no registro.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Situação</th><th>Queda em relação à base</th><th>Exemplo com base de 50.000</th></tr></thead><tbody>
      ${NIVEIS_INC.map((n,i)=>{const de=i?NIVEIS_INC[i-1].ate:0;return `<tr><td>${pillNivel(n)}</td><td class="mono">${n.ate===Infinity?`acima de ${de}%`:`${i?"acima de "+de+"% até ":"até "}${n.ate}%`}</td><td class="mono small">${n.ate===Infinity?`menos de ${(50000*(1-de/100)).toLocaleString("pt-BR")} online`:`a partir de ${(50000*(1-n.ate/100)).toLocaleString("pt-BR")} online`}</td></tr>`}).join("")}
    </tbody></table></div>
    <p class="hint">Faixas propostas pelo Patrick Moura (29/09). Começam iguais para todas as operadoras; a Análise do mês no painel ajuda a ajustar por operadora.</p>
    ${podeBase?`<form id="fBase" class="stack" style="gap:10px"><div class="basegrid">${ops.filter(o=>!isBL(o)).map((o,i)=>`<label class="fsel"><span class="row" style="gap:6px;flex-wrap:nowrap;text-transform:none;letter-spacing:0">${opMarca(o,16)}${esc(o)}</span><input class="in mono" type="number" min="0" id="incB${i}" data-incb="${esc(o)}" value="${S.incBase[o]||""}" placeholder="sem base"></label>`).join("")}</div>
      <div class="row" style="justify-content:flex-end"><span class="row"><button type="button" class="btn sm" data-act="baseExemplo" title="Só no protótipo">Protótipo: preencher exemplo</button><button class="btn">Salvar base</button></span></div></form>`

const RET_MESES = 3, AVISO_DIAS = 7;

const somaMeses = (ms,n) => {const d=new Date(ms);d.setMonth(d.getMonth()+n);return d.getTime()};
const msDia = iso => new Date(iso+"T00:00:00").getTime();
const brMs = str => {const m=/(\d{2})\/(\d{2})\/(\d{4})(?: (\d{2}):(\d{2}))?/.exec(str||"");return m?new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)).getTime():0};

const refPlat = x => platFim(x);                  // Painel 2: data de normalização (em andamento não vence)
const venceEm = ref => ref==null ? Infinity : somaMeses(ref, RET_MESES);

const vencendo = escopo => { const t=agora(), lim=t+AVISO_DIAS*86400000, ok=ref=>{const v=venceEm(ref);return v>t&&v<=lim};

function vRetorno(){
  const fila = S.tickets.filter(t=>!t.excluido && podeChamado("retorno",t) && (t.status==="Em análise"||t.status==="Resolvido"));
  const espera = S.tickets.filter(t=>!t.excluido && podeChamado("ver",t) && t.status==="Aguardando retorno" && t.encerraEm);
  const t = tk(S.retSel);
  let right = `<div class="empty">Selecione um chamado à esquerda para preparar o retorno.</div>`;
  if(t && fila.includes(t)){
    const c = cli(t.cliente);
    const corpo = t.rascunho ? t.rascunho.corpo : textoRetorno(t);
    right = `<form id="fRet" class="stack">
      <div class="row" style="justify-content:space-between"><div class="row"><span class="mono">${t.id}</span>${pill(t.status)}</div><button type="button" class="btn sm" data-open="${t.id}">Abrir chamado</button></div>
      <div class="mail"><dl class="mh"><dt>De</dt><dd class="mono">${esc(S.noreply)}</dd><dt>Responder para</dt><dd class="mono">${esc(S.replyTo)} <span class="muted small" style="font-family:var(--sans)">· respostas caem no hub ${ad("email_retorno","criação com a TI")}</span></dd><dt>Para</dt><dd>${esc(c.email)} <span class="muted small">· do cadastro de ${esc(c.nome)}</span></dd><dt><label for="retCc">Cc</label></dt><dd><input class="in mono" id="retCc" type="text" inputmode="email" autocomplete="off" placeholder="opcional · vários: separe por vírgula" value="${esc((t.rascunho&&t.rascunho.cc)||"")}" style="padding:5px 8px"></dd><dt><label for="retCco">Cco</label></dt><dd><input class="in mono" id="retCco" type="text" inputmode="email" autocomplete="off" placeholder="opcional · cópia oculta (o cliente não vê)" value="${esc((t.rascunho&&t.rascunho.cco)||"")}" style="padding:5px 8px"></dd><dt>Assunto</dt><dd><input class="in" id="retAss" value="${esc(t.rascunho?t.rascunho.assunto:"Chamado "+t.id+" — retorno do suporte")}" style="padding:5px 8px"></dd></dl>
      <div style="padding:12px 14px"><label class="small muted" for="retCorpo">Mensagem</label><textarea class="in" id="retCorpo" style="min-height:240px;margin-top:6px">${esc(corpo)}</textarea></div></div>
      <div class="timer"><div class="small">Depois do envio, o chamado fica <b>Aguardando retorno</b> por 1 dia útil. Se o cliente não responder nesse prazo, ele é encerrado automaticamente.</div></div>
      <div class="row" style="justify-content:flex-end">${t.rascunho?`<span class="small muted" style="margin-right:auto">Texto preparado por ${esc(t.rascunho.por)} em ${esc(t.rascunho.em)}</span>`:""}${podeChamado("retorno",t)?`<button class="btn primary">Enviar retorno e aguardar 1 dia útil</button>`:""}</div>
    </form>`;
  }
  return `<div class="page">
  <div class="head"><div class="t"><h1>Retorno ao cliente</h1><p class="muted">Selecione um chamado em análise ou resolvido para enviar a devolutiva por e-mail.</p></div><span class="small muted">Envio: Ouro e Diamante</span></div>
  <div class="split">
    <section class="card"><div class="label pad" style="padding-bottom:8px">Chamados aguardando retorno · ${fila.length}</div>
      ${fila.map(x=>`<button class="qitem ${x.id===S.retSel?"on":""}" data-ret="${x.id}"><span class="qtop"><span class="mono">${x.id}</span>${pill(x.status)}</span><span class="qtit">${esc(x.titulo)}</span><span class="small muted">${esc(cli(x.cliente).email)}</span></button>`).join("")||`<div class="empty">Nenhum chamado aguardando retorno.</div>`}
    </section>
    <section class="card pad">${right}</section>
  </div>
  ${espera.length?`<section class="card"><div class="label pad" style="padding-bottom:8px">Aguardando resposta do cliente · ${espera.length}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Protocolo</th><th>Cliente</th><th>Encerra em</th><th>Quando</th></tr></thead><tbody>
    ${espera.map(x=>`<tr class="click" data-open="${x.id}"><td class="mono">${x.id}</td><td>${esc(cli(x.cliente).nome)}</td><td class="mono">${fmtDataHora(x.encerraEm)}</td><td>${quandoEnc(x.encerraEm)}</td></tr>`).join("")}
    </tbody></table></div></section>`:""}
  <div class="info">O envio usa o endereço no-reply do E.J. Desk. O cliente não responde pelo e-mail; se ele entrar em contato pelos canais de atendimento em até 1 dia útil, a equipe registra a resposta no chamado. Sem resposta, o chamado é encerrado automaticamente. Depois de encerrado, Ouro/Diamante ainda podem reabrir.</div>
  </div>`;
}

const dataISO = iso => { if(!iso) return null; const [a,m,d]=iso.split("-").map(Number); return a&&m&&d ? new Date(a,m-1,d) : null; };
function anosDeEmpresa(iso, hoje=new Date(agora())){
  const d=dataISO(iso); if(!d||d>hoje) return 0;
  let n=hoje.getFullYear()-d.getFullYear();
  if(hoje.getMonth()<d.getMonth() || (hoje.getMonth()===d.getMonth() && hoje.getDate()<d.getDate())) n--;
  return Math.max(0,n);
}
const insigniaDe = u => { const n=anosDeEmpresa(u&&u.admissao); return INSIGNIAS.filter(i=>n>=i.anos).pop()||null; };
const quandoCompleta = (iso, anos) => { const d=dataISO(iso); return d ? new Date(d.getFullYear()+anos, d.getMonth(), d.getDate()) : null; };
const fraseAnos = n => `Completou ${n} ano${n>1?"s":""} de ${EMPRESA}`;
function insigniaSVG(i, tam=40, modelo=S.insModelo){
  if(modelo==="brasoes" && INS_IMG[i.anos]) return `<img src="${INS_IMG[i.anos]}" width="${tam}" height="${tam}" alt="" draggable="false" style="display:block;object-fit:contain;width:${tam}px;height:${tam}px">`;
  /* Desenho próprio: medalhão facetado que ganha detalhes a cada nível —
     louros (2+), pontas de estrela (5+), coroa (10+) e raios (15). */
  const k=INSIGNIAS.indexOf(i), id="ig"+i.anos+"-"+tam+"-"+(insigniaSVG.n=(insigniaSVG.n||0)+1);
  const g=`url(#${id}g)`, gl=`url(#${id}l)`;
  const pol=(n,r,rot=0,cx=32,cy=33)=>Array.from({length:n},(_,a)=>{const t=rot+a*2*Math.PI/n;return (cx+r*Math.sin(t)).toFixed(1)+","+(cy-r*Math.cos(t)).toFixed(1)}).join(" ");
  const estrela=(n,r1,r2)=>Array.from({length:n*2},(_,a)=>{const t=a*Math.PI/n,r=a%2?r2:r1;return (32+r*Math.sin(t)).toFixed(1)+","+(33-r*Math.cos(t)).toFixed(1)}).join(" ");
  const louro=lado=>{const nf=k>=4?6:k>=2?5:4, R=25, a0=158, a1=k>=4?40:55, P=d=>[32+R*Math.sin(d*Math.PI/180), 33-R*Math.cos(d*Math.PI/180)];
    const fol=Array.from({length:nf},(_,a)=>{const d=a0+(a1-a0)*a/(nf-1), [x,y]=P(d), rot=d+180+28;
      return `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="5" ry="2" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)}) translate(3.2 0)"/>`}).join("");
    const [x0,y0]=P(a0),[x1,y1]=P(a1);
    return `<g transform="${lado<0?"translate(64 0) scale(-1 1)":""}" fill="${gl}" stroke="${i.cor}" stroke-width=".6"><path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 0 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${i.cor}" stroke-width="1.2"/>${fol}</g>`};
  const corpo = k>=4 ? `<polygon points="${estrela(8,24,17)}" fill="${g}" stroke="${i.cor}" stroke-width="1.6" stroke-linejoin="round"/>`
              : k>=2 ? `<polygon points="${pol(6,21)}" fill="${g}" stroke="${i.cor}" stroke-width="1.6" stroke-linejoin="round"/>`
              : `<circle cx="32" cy="33" r="19" fill="${g}" stroke="${i.cor}" stroke-width="1.6"/>`;
  const aro = k>=4 ? `<polygon points="${pol(8,15,Math.PI/8)}" fill="none" stroke="${i.brilho}" stroke-opacity=".7" stroke-width="1.2"/>`
            : k>=2 ? `<polygon points="${pol(6,15.5)}" fill="none" stroke="${i.brilho}" stroke-opacity=".7" stroke-width="1.2"/>`
            : `<circle cx="32" cy="33" r="14" fill="none" stroke="${i.brilho}" stroke-opacity=".7" stroke-width="1.2"/>`;
  const gema = `<polygon points="32,24 39,31 32,42 25,31" fill="${gl}" stroke="${i.cor}" stroke-width="1"/><polygon points="32,24 35.5,31 32,42 28.5,31" fill="${i.brilho}" fill-opacity=".55"/><polyline points="25,31 39,31" stroke="${i.cor}" stroke-width=".8" fill="none"/>`;
  const coroa = k>=5 ? `<path d="M22 13l4 4 6-7 6 7 4-4-1.5 8h-17z" fill="${gl}" stroke="${i.cor}" stroke-width="1" stroke-linejoin="round"/><circle cx="32" cy="9.6" r="1.6" fill="${i.brilho}"/>` : "";
  const raios = k>=6 ? `<g stroke="${i.cor2}" stroke-width="1.4" stroke-linecap="round" opacity=".85">${Array.from({length:12},(_,a)=>{const t=a*Math.PI/6+Math.PI/12;return `<line x1="${(32+27*Math.sin(t)).toFixed(1)}" y1="${(33-27*Math.cos(t)).toFixed(1)}" x2="${(32+31*Math.sin(t)).toFixed(1)}" y2="${(33-31*Math.cos(t)).toFixed(1)}"/>`}).join("")}</g>` : "";
  const fita = tam<32 ? "" : `<path d="M15 51h34l-3 4.5 3 4.5H15l3-4.5z" fill="${i.cor}" stroke="${i.brilho}" stroke-opacity=".5" stroke-width=".6"/><text x="32" y="57.7" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="6" letter-spacing=".3" fill="#fff">${i.anos} ${i.anos>1?"ANOS":"ANO"}</text>`;
  return `<svg viewBox="0 0 64 64" width="${tam}" height="${tam}" aria-hidden="true">
    <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${i.brilho}"/><stop offset=".45" stop-color="${i.cor2}"/><stop offset="1" stop-color="${i.cor}"/></linearGradient>
      <linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${i.cor2}"/><stop offset="1" stop-color="${i.cor}"/></linearGradient></defs>
    ${raios}${k>=1?louro(1)+louro(-1):""}${corpo}${aro}${gema}${coroa}${fita}
  </svg>`;
}
/* Aura: cor da insígnia; intensidade, tamanho e velocidade sobem com o nível. Faíscas a partir de Lendário. */
const AURA_COR = {1:["#E3A574","#8C5A3C"],2:["#DCE7F5","#8FA6C2"],3:["#FFC94A","#C8861E"],5:["#5FA8FF","#2A4FC9"],7:["#D06BFF","#7A2FC0"],10:["#FF5A3C","#B3202E"],15:["#5FE3FF","#E7B44A"]};
function auraHTML(i, tam){

/* A roda do mouse nunca rola a página do fundo: só rola dentro do PDF/texto/planilha, ou dá zoom na foto. */
function prenderRoda(v){v.addEventListener("wheel",ev=>{const sc=ev.target.closest("pre,.anx-pdf");if(!sc){ev.preventDefault();return}
  const fim=ev.deltaY>0?sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1:sc.scrollTop<=0;if(fim)ev.preventDefault()},{passive:false})}
function zoomFoto(v){
  const palco=v.querySelector(".anx-palco"), img=palco.querySelector("img"), out=v.querySelector(".anx-zoom output");
  let k=1,x=0,y=0,arr=null;
  const lim=()=>{const w=img.offsetWidth*k,h=img.offsetHeight*k,mx=Math.max(0,(w-palco.clientWidth)/2),my=Math.max(0,(h-palco.clientHeight)/2);x=Math.min(mx,Math.max(-mx,x));y=Math.min(my,Math.max(-my,y))};
  const pinta=()=>{if(k<=1){k=Math.max(k,.25);if(k<=1){x=0;y=0}}lim();img.style.transform=`translate(${x}px,${y}px) scale(${k})`;out.textContent=Math.round(k*100)+"%";palco.classList.toggle("zoom",k>1)};
  const z=v._zoom={passo:f=>{k=Math.min(8,Math.max(.25,k*f));pinta()},ajustar:()=>{k=1;x=0;y=0;pinta()}};
  palco.addEventListener("wheel",ev=>{ev.preventDefault();const r=img.getBoundingClientRect(),cx=ev.clientX-(r.left+r.width/2),cy=ev.clientY-(r.top+r.height/2),f=ev.deltaY<0?1.15:1/1.15,n=Math.min(8,Math.max(.25,k*f)),q=n/k;
    x-=cx*(q-1);y-=cy*(q-1);k=n;pinta()},{passive:false});
  img.addEventListener("dblclick",ev=>{ev.stopPropagation();k>1?z.ajustar():z.passo(2)});
  img.addEventListener("click",ev=>ev.stopPropagation());
  img.addEventListener("pointerdown",ev=>{if(k<=1)return;arr={px:ev.clientX,py:ev.clientY,x,y};img._moveu=false;palco.classList.add("arrastando");img.setPointerCapture(ev.pointerId)});
  img.addEventListener("pointermove",ev=>{if(!arr)return;x=arr.x+ev.clientX-arr.px;y=arr.y+ev.clientY-arr.py;if(Math.abs(ev.clientX-arr.px)+Math.abs(ev.clientY-arr.py)>3)img._moveu=true;pinta()});
  const solta=()=>{arr=null;palco.classList.remove("arrastando")};img.addEventListener("pointerup",solta);img.addEventListener("pointercancel",solta);
  v.querySelector(".anx-zoom").addEventListener("click",ev=>{ev.stopPropagation();const b=ev.target.closest("[data-z]");if(!b)return;b.dataset.z==="+"?z.passo(1.25):b.dataset.z==="-"?z.passo(1/1.25):z.ajustar()});
  img.complete?pinta():img.addEventListener("load",pinta)}

/* ---------- Registro no histórico (auditoria) ---------- */
const stamp = () => fmtDataHora(agora());
const registrar = (t, txt) => t.hist.push([stamp(), txt]);
/* Mudança de status centralizada: usada pela lista, pelo menu e pela página do chamado. */
function mudarStatus(t, novo, sufixo=""){
  const ant=t.status; if(ant===novo) return false;
  t.status=novo;
  if(ant==="Aguardando retorno"){ t.encerraEm=null; const pz=(t.pausas||[]).find(p=>!p.fim); if(pz) pz.fim=agora(); }
  if(novo==="Encerrado"){ t.encerradoAuto=false; }
  registrar(t, `Status alterado de "${ant}" para "${novo}" por ${me().nome}${sufixo}`);
  return true;
}
function mudarResp(t, novo){
  const ant=respNome(t), nv=novo==="—"?"Fila geral":novo; if(t.resp===novo) return false;
  t.resp=novo;
  registrar(t, novo==="—" ? `Responsável removido (${ant} → Fila geral) por ${me().nome}` : (ant==="Fila geral" ? `Chamado atribuído a ${nv} por ${me().nome}` : `Responsável alterado de ${ant} para ${nv} por ${me().nome}`));
  return true;
}
function textoRetorno(t){
  const c=cli(t.cliente), eq=t.setor==="financeiro"?"Financeiro":"Suporte";
  return `Olá, ${c.nome}.\n\nSeu chamado ${t.id} (${t.titulo}) foi tratado pela nossa equipe.\n\n${t.solucao?("Solução aplicada:\n"+t.solucao):"Situação atual:\n[descreva a tratativa e o próximo passo]"}\n\nEste e-mail é automático e não recebe respostas. Se ainda precisar de ajuda, entre em contato pelos canais de atendimento da Meta Telecom em até 1 dia útil, informando o protocolo ${t.id}. Depois desse prazo, o chamado será encerrado.\n\nAtenciosamente,\nEquipe de ${eq} — E.J. Desk`;
}
async function copiarTexto(txt, fallbackEl){
  try{ await navigator.clipboard.writeText(txt); toast("Retorno copiado"); }
  catch(e){ if(fallbackEl){fallbackEl.focus();fallbackEl.select();} toast("Não foi possível copiar automaticamente. O texto está selecionado: use Ctrl+C."); }
}

/* ---------- PDF do chamado ---------- */
const pdfTxt = s => String(s??"").replace(/[→]/g,"->").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x00-\xFF—–•…]/g,"");
async function gerarPDF(t){
  const J = window.jspdf && window.jspdf.jsPDF;
  if(!J){ toast("O gerador de PDF não carregou. Verifique a conexão e tente de novo."); return; }
  const c=cli(t.cliente), doc=new J({unit:"pt",format:"a4"}), W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=48;
  let y=0;
  const novaPag=()=>{doc.addPage();y=M;};
  const precisa=h=>{if(y+h>H-56) novaPag();};
  // Cabeçalho
  doc.setFillColor(15,23,36); doc.rect(0,0,W,78,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("E.J. Desk",M,34);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(180,190,205); doc.text("Meta Telecom · Relatório do chamado",M,50);
  doc.setFont("courier","bold"); doc.setFontSize(13); doc.setTextColor(255,255,255); doc.text(t.id,W-M,40,{align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(180,190,205); doc.text(pdfTxt(`Status: ${t.excluido?"Excluído":t.status}`),W-M,56,{align:"right"});
  y=110; doc.setTextColor(20,27,38); doc.setFont("helvetica","bold"); doc.setFontSize(15);
  doc.splitTextToSize(pdfTxt(t.titulo),W-2*M).forEach(l=>{doc.text(l,M,y);y+=19;});
  const secao=nome=>{precisa(40);y+=12;doc.setDrawColor(30,79,214);doc.setLineWidth(1.2);doc.line(M,y,M+24,y);y+=14;doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(30,79,214);doc.text(pdfTxt(nome.toUpperCase()),M,y);y+=14;doc.setTextColor(20,27,38);};
  const pares=(lista)=>{ // grade de 2 colunas rótulo/valor
    const colW=(W-2*M-20)/2; lista=lista.filter(([,v])=>v!==undefined&&v!==null&&String(v).trim()!=="");
    for(let i=0;i<lista.length;i+=2){
      const linhas=[lista[i],lista[i+1]].filter(Boolean).map(([k,v])=>[k,doc.splitTextToSize(pdfTxt(v),colW)]);
      const h=Math.max(...linhas.map(([,v])=>v.length))*12+18; precisa(h);
      linhas.forEach(([k,v],j)=>{const x=M+j*(colW+20);doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(91,102,119);doc.text(pdfTxt(k.toUpperCase()),x,y);
        doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(20,27,38);v.forEach((l,n)=>doc.text(l,x,y+13+n*12));});
      y+=h;
    }
  };
  const bloco=(k,v)=>{ if(!v) return; const ls=doc.splitTextToSize(pdfTxt(v),W-2*M); precisa(18+Math.min(ls.length,4)*12);
    doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(91,102,119);doc.text(pdfTxt(k.toUpperCase()),M,y);y+=13;
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(20,27,38);ls.forEach(l=>{precisa(12);doc.text(l,M,y);y+=12;});y+=6; };
  secao("Informações do chamado");
  pares([["Protocolo",t.id],["Status",t.excluido?"Excluído":t.status],["Categoria",t.cat],["Classificação",[t.flags.atipico?"Atípico":"",t.flags.atrasado?"Atrasado":""].filter(Boolean).join(", ")||"Nenhuma"],
    ["Prioridade",t.prioridade||"Normal"],["Setor",SETORES[t.setor]?.nome],["Responsável",respNome(t)],["Criado por",t.criadoPor],["Data de abertura",t.aberto],["O caso é sobre",t.caso]]);
  secao("Cliente");
  pares([["Nome",c.nome],["CNPJ/CPF",c.doc],["E-mail",c.email],["Telefone",c.tel||"—"]]);
  secao("Informações da abertura");
  pares([[ehLink(t.protAt)?"Link do NSend":"Protocolo do atendimento",t.protAt],["CEP da linha",t.cep],["MSISDN ou ICCID",t.linha],["Equipamentos",t.equip],["Comandos",t.comandos]]);
  bloco("Descrição / B.O",t.bo); bloco("O que já foi feito",t.feito);
  if(t.anexos.length) bloco("Anexos",t.anexos.join(" · "));
  if(t.solucao){ secao("Resolução"); bloco("Solução aplicada",t.solucao); bloco("Observações finais",t.obs); }
  secao("Histórico");
  t.hist.forEach(([h,x])=>{const ls=doc.splitTextToSize(pdfTxt(x),W-2*M-110);precisa(ls.length*12+6);doc.setFont("courier","normal");doc.setFontSize(9);doc.setTextColor(91,102,119);doc.text(pdfTxt(h),M,y);
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(20,27,38);ls.forEach((l,n)=>doc.text(l,M+110,y+n*12));y+=ls.length*12+6;});
  secao("Comentários");
  if(!t.coments.length){doc.setFont("helvetica","italic");doc.setFontSize(10);doc.setTextColor(91,102,119);doc.text("Nenhum comentário.",M,y);y+=14;}
  t.coments.forEach(m=>{const ls=doc.splitTextToSize(pdfTxt(m.txt),W-2*M);precisa(ls.length*12+22);doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(20,27,38);doc.text(pdfTxt(m.a),M,y);
    doc.setFont("courier","normal");doc.setFontSize(8.5);doc.setTextColor(91,102,119);doc.text(pdfTxt(m.t),W-M,y,{align:"right"});y+=13;doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(20,27,38);
    ls.forEach(l=>{doc.text(l,M,y);y+=12;});y+=8;});
  // Rodapé em todas as páginas
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(221,226,234);doc.setLineWidth(.5);doc.line(M,H-40,W-M,H-40);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(91,102,119);
    doc.text(pdfTxt(`Gerado em ${stamp()} por ${me().nome} · Documento interno E.J. Desk`),M,H-26);doc.text(`${i} / ${n}`,W-M,H-26,{align:"right"});}
  const blob=doc.output("blob"), nome=`${t.id}.pdf`;
  registrar(t, `PDF extraído por ${me().nome}`);
  const dl = window.claude ? await claude.use("downloads").catch(()=>null) : null;
  if(dl){ try{ await dl.save({filename:nome, data:blob}); toast("PDF do chamado "+t.id+" gerado"); }
    catch(e){ toast(e?.code==="declined"?"Download cancelado":"Não foi possível salvar o PDF aqui."); } }
  else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); toast("PDF do chamado "+t.id+" gerado"); }
  render();
}

/* Ações de chamado: toda execução confere podeChamado() no momento da ação, não só no menu. */
const ACAO_CHAMADO = {abrir:"ver", pdf:"ver", restaurar:"excluir", assumir:"tratar", resolver:"tratar", atribuir:"tratar", setResp:"tratar", setStatus:"tratar", alterarStatus:"tratar",
  atipico:"tratar", reabrir:"tratar", encerrarDireto:"tratar", unificarChamado:"tratar", clienteRespondeu:"tratar", retornoPrep:"retorno", excluir:"excluir", editarCh:"excluir"};   // 02/10: editarCh = Diamante edita todos os dados do chamado

  if(a==="unificarChamado"){const o=tk(el.dataset.outro); if(!o||!podeChamado("tratar",o)||o.excluido||o.status==="Encerrado"||o.vinculadoA){toast("Não é possível juntar esse chamado");return}
    modal(`<h2>Juntar ${o.id} a ${t.id}</h2><p class="small">O chamado <b>${o.id}</b> (${esc(el.dataset.motivo)}) será unificado a <b>${t.id}</b>, que continua como o principal.</p>
      <ul class="small" style="margin:0;padding-left:18px"><li>Comentários, anexos e histórico do ${o.id} passam para o ${t.id}.</li><li>O ${o.id} vai para Encerrado, com a marcação "Unificado → ${t.id}" e um link para o principal.</li><li>Nada é apagado: o ${o.id} continua na busca e no histórico.</li></ul>`,

      </div><span class="errtxt" id="mErr"></span>`,
      w=>{ if(!ok()) return; const g=id=>{const e=w.querySelector("#"+id);return e?e.value.trim():undefined};
